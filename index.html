<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Spotify Playlist Creator v1.7
</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#0f0f0f,
#121212,
#1DB954
);

min-height:100vh;

display:flex;

justify-content:center;

padding:30px;

color:white;
}

.card{

width:100%;

max-width:900px;

background:
rgba(
20,
20,
20,
0.95
);

padding:30px;

border-radius:25px;

box-shadow:
0 0 40px rgba(
0,
0,
0,
0.5
);

}

h1{
margin:0;
color:#1DB954;
}

.version{

display:inline-block;

padding:8px 15px;

margin-top:10px;

background:#1DB954;

color:black;

font-weight:bold;

border-radius:20px;

}

input,
textarea{

width:100%;

margin-top:15px;

padding:15px;

background:#222;

border:none;

border-radius:15px;

color:white;

}

textarea{
height:250px;
}

.buttons{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:20px;

}

button{

flex:1;

padding:14px;

border:none;

border-radius:15px;

font-weight:bold;

cursor:pointer;

color:white;

}

.green{
background:#1DB954;
color:black;
}

.orange{
background:#ff9800;
}

.blue{
background:#2196F3;
}

.red{
background:#e53935;
}

.counter{
margin-top:15px;
font-weight:bold;
}

.progress{

height:12px;

background:#333;

border-radius:20px;

overflow:hidden;

margin-top:10px;

}

.progressFill{

height:100%;

width:0%;

background:#1DB954;

}

#log{

margin-top:20px;

padding:20px;

background:#111;

border-radius:20px;

font-family:monospace;

white-space:pre-wrap;

max-height:350px;

overflow:auto;

}

.history{

margin-top:20px;

padding:15px;

background:#191919;

border-radius:15px;

}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator
</h1>

<div class="version">
Versión v1.7
</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs"
placeholder="Queen - Bohemian Rhapsody
Michael Jackson - Billie Jean">
</textarea>

<div class="counter">

Canciones:
<span id="count">
0
</span>

/100

</div>

<div class="progress">

<div
class="progressFill"
id="progress">
</div>

</div>

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">
Conectar
</button>

<button
class="orange"
onclick="changeUser()">
Cambiar cuenta
</button>

<button
class="blue"
onclick="createPlaylist()">
Crear playlist
</button>

<button
class="red"
onclick="clearStorage()">
Borrar
</button>

</div>

<div id="log">
Esperando conexión
</div>

<div class="history">

<h3>
Historial local
</h3>

<div id="history">
Sin playlists
</div>

</div>

</div>

<script>

const APP_VERSION="v1.7";

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function updateCounter(){

let songs=
document
.getElementById(
"songs"
)
.value
.split("\n")
.filter(
x=>x.trim()
);

if(
songs.length>100
){

songs=
songs.slice(
0,
100
);

document
.getElementById(
"songs"
)
.value=
songs.join(
"\n"
);

}

document
.getElementById(
"count"
).innerText=
songs.length;

document
.getElementById(
"progress"
).style.width=
songs.length+
"%";

}

document
.getElementById(
"songs"
)
.addEventListener(
"input",
updateCounter
);

function clearStorage(){

localStorage.clear();

sessionStorage.clear();

location.reload();

}

function changeUser(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

clearStorage();

}

function randomString(n){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let r="";

for(let i=0;i<n;i++){

r+=chars[
Math.floor(
Math.random()*
chars.length
)
];

}

return r;

}

async function challenge(v){

const data=
new TextEncoder()
.encode(v);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return btoa(
String.fromCharCode(
...new Uint8Array(hash)
))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(64);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

const params=
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:
c

});

window.location.href=
"https://accounts.spotify.com/authorize?"+
params.toString();

}

updateCounter();

</script>

</body>

</html>
