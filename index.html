<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Spotify Playlist Creator AI v3.6
</title>

<style>

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#050505,
#121212,
#1DB954
);

padding:30px;
color:white;
}

.card{
max-width:1100px;
margin:auto;
background:#111;
padding:30px;
border-radius:25px;
}

.statusBox{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.status{
padding:12px 20px;
border-radius:15px;
font-weight:bold;
}

.green{
background:#1DB954;
color:black;
}

.red{
background:#e53935;
}

.orange{
background:#ff9800;
color:black;
}

input,
textarea,
select,
button{

width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:15px;

}

input,
textarea,
select{
background:#222;
color:white;
}

textarea{
height:220px;
resize:vertical;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.buttons button{
flex:1;
}

#log{
margin-top:20px;
background:black;
padding:20px;
border-radius:20px;
white-space:pre-wrap;
max-height:320px;
overflow:auto;
}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator AI
</h1>

<div>
Versión v3.6
</div>

<div class="statusBox">

<div
id="spotifyStatus"
class="status red">

Spotify 🔴

</div>

<div
id="deepseekStatus"
class="status red">

DeepSeek 🔴

</div>

<div
id="playlistStatus"
class="status red">

Playlist 🔴

</div>

</div>

<!-- BOTONES ARRIBA -->

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">

Conectar Spotify

</button>

<button
class="orange"
onclick="changeUser()">

Cambiar cuenta

</button>

<button
class="green"
onclick="createPlaylist()">

Crear Playlist

</button>

</div>

<input
id="deepseekKey"
placeholder="DeepSeek API Key">

<div class="buttons">

<button
class="green"
onclick="saveDeepSeek()">

Guardar

</button>

<button
class="orange"
onclick="testDeepSeek()">

Probar DeepSeek

</button>

</div>

<textarea
id="promptAI"
placeholder="Rock carretera USA">
</textarea>

<select id="songCount">

<option value="10">10 canciones</option>
<option value="20">20 canciones</option>
<option value="40">40 canciones</option>
<option value="50">50 canciones</option>
<option value="60">60 canciones</option>
<option value="80">80 canciones</option>
<option value="100">100 canciones</option>
<option value="200">200 canciones</option>

</select>

<div class="buttons">

<button
class="orange"
onclick="generateDeepSeek()">

Generar Lista

</button>

<button
class="orange"
onclick="generateDeepSeek(true)">

Buscar Más

</button>

</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs">
</textarea>

<div id="log">
Esperando conexión
</div>

</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function saveDeepSeek(){

localStorage.setItem(
"deepseek_key",
document.getElementById(
"deepseekKey"
).value.trim()
);

updateStatus();

msg(
"DeepSeek guardada"
);

}

document.getElementById(
"deepseekKey"
).value=
localStorage.getItem(
"deepseek_key"
)||"";

async function generateDeepSeek(more=false){

const key=
localStorage.getItem(
"deepseek_key"
);

const count=
document.getElementById(
"songCount"
).value;

msg(
more ?
"Buscando más..."
:
"Generando..."
);

const r=
await fetch(
"https://api.deepseek.com/chat/completions",
{
method:"POST",

headers:{
Authorization:
`Bearer ${key}`,

"Content-Type":
"application/json"
},

body:
JSON.stringify({

model:
"deepseek-chat",

messages:[
{
role:"user",

content:
`
Genera EXACTAMENTE ${count} canciones

Formato:

ARTISTA - CANCION

Tema:

${document.getElementById(
"promptAI"
).value}

${
more ?
"No repitas canciones":
""
}

Sin numeración
`
}
]

})

}
);

const d=
await r.json();

document.getElementById(
"songs"
).value=
d.choices?.[0]
?.message
?.content || "";

msg(
"Lista generada"
);

}

updateStatus();

</script>

</body>

</html>
