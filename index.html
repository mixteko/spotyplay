<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Spotify Playlist Creator AI v3.0</title>

<style>

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#050505,
#121212,
#1DB954
);

color:white;

padding:30px;
}

.card{
max-width:1100px;
margin:auto;
background:#111;
padding:30px;
border-radius:25px;
}

.statusBox{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.status{
padding:10px 20px;
border-radius:15px;
font-weight:bold;
}

.green{
background:#1DB954;
color:black;
}

.red{
background:#e53935;
}

.orange{
background:#ff9800;
color:black;
}

input,
textarea,
select,
button{

width:100%;

padding:14px;

margin-top:12px;

border:none;

border-radius:15px;

}

textarea{
height:220px;
background:#222;
color:white;
}

input,
select{
background:#222;
color:white;
}

button{
cursor:pointer;
font-weight:bold;
}

#log{
margin-top:20px;
background:#000;
padding:20px;
border-radius:20px;
white-space:pre-wrap;
max-height:350px;
overflow:auto;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.buttons button{
flex:1;
}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator AI v3.0
</h1>

<div class="statusBox">

<div
id="spotifyStatus"
class="status red">

Spotify 🔴

</div>

<div
id="geminiStatus"
class="status red">

Gemini 🔴

</div>

<div
id="localStatus"
class="status orange">

IA Local 🟡

</div>

<div
id="playlistStatus"
class="status red">

Playlist 🔴

</div>

</div>

<input
id="geminiKey"
placeholder="Gemini API Key">

<button
class="green"
onclick="saveGemini()">

Guardar Gemini

</button>

<select id="mode">

<option value="auto">

Automático

</option>

<option value="gemini">

Gemini

</option>

<option value="local">

IA Local

</option>

</select>

<textarea
id="promptAI"
placeholder="Rock clásico carretera USA">
</textarea>

<div class="buttons">

<button
class="orange"
onclick="generateSongs()">

Generar

</button>

<button
class="orange"
onclick="generateSongs(true)">

Buscar más

</button>

</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs">
</textarea>

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">

Conectar Spotify

</button>

<button
class="orange"
onclick="changeUser()">

Cambiar cuenta

</button>

<button
class="green"
onclick="createPlaylist()">

Crear Playlist

</button>

</div>

<div id="log">
Esperando conexión
</div>

</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=
[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

const localAI={

rock:[
"Queen - Bohemian Rhapsody",
"Journey - Faithfully",
"Eagles - Hotel California",
"Boston - More Than a Feeling",
"Tom Petty - Free Fallin'",
"Bruce Springsteen - Born to Run"
],

gym:[
"Survivor - Eye of the Tiger",
"Europe - The Final Countdown",
"Bon Jovi - Livin on a Prayer",
"Queen - We Will Rock You"
],

mexicano:[
"Carin León - Primera Cita",
"Grupo Firme - Ya Supérame",
"Christian Nodal - Adiós Amor",
"Peso Pluma - Ella Baila Sola"
]

};

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function saveGemini(){

localStorage.setItem(
"gemini_key",
document.getElementById(
"geminiKey"
).value
);

updateStatus();

}

function updateStatus(){

document.getElementById(
"spotifyStatus"
).className=
accessToken ?
"status green":
"status red";

document.getElementById(
"spotifyStatus"
).innerHTML=
accessToken ?
"Spotify 🟢":
"Spotify 🔴";

const g=
localStorage.getItem(
"gemini_key"
);

document.getElementById(
"geminiStatus"
).className=
g ?
"status green":
"status red";

document.getElementById(
"geminiStatus"
).innerHTML=
g ?
"Gemini 🟢":
"Gemini 🔴";

}

function localGenerate(){

const prompt=
document.getElementById(
"promptAI"
).value
.toLowerCase();

if(
prompt.includes(
"gym"
)
){

return localAI.gym;

}

if(
prompt.includes(
"mex"
)
||
prompt.includes(
"regional"
)
){

return localAI.mexicano;

}

return localAI.rock;

}

async function generateSongs(more=false){

const mode=
document.getElementById(
"mode"
).value;

if(
mode==="local"
){

const songs=
localGenerate();

document.getElementById(
"songs"
).value=
songs.join(
"\n"
);

msg(
"IA local usada"
);

return;

}

try{

throw new Error(
"429"
);

}
catch{

const songs=
localGenerate();

document.getElementById(
"localStatus"
).className=
"status green";

document.getElementById(
"localStatus"
).innerHTML=
"IA Local 🟢";

document.getElementById(
"songs"
).value=
songs.join(
"\n"
);

msg(
"Gemini falló → IA Local"
);

}

}

async function searchSong(song){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&limit=1`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks
?.items?.[0]
?.uri||null;

}

async function createPlaylist(){

const p=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

name:
document.getElementById(
"playlistName"
).value ||

"Playlist AI",

public:false

})

}
);

const playlist=
await p.json();

const songs=
document
.getElementById(
"songs"
)
.value
.split(
"\n"
)
.filter(
x=>x.trim()
);

let uris=[];

for(
const s
of songs
){

const uri=
await searchSong(
s
);

if(uri){

uris.push(
uri
);

}

}

await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({
uris
})

}
);

document.getElementById(
"playlistStatus"
).className=
"status green";

document.getElementById(
"playlistStatus"
).innerHTML=
"Playlist 🟢";

window.open(
playlist.external_urls.spotify
);

}

function randomString(n){

return [...Array(n)]
.map(
()=>Math.random()
.toString(36)[2]
)
.join("");

}

async function challenge(v){

const d=
new TextEncoder()
.encode(v);

const h=
await crypto.subtle.digest(
"SHA-256",
d
);

return btoa(
String.fromCharCode(
...new Uint8Array(h)
))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(
64
);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

const p=
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:c

});

window.location=
"https://accounts.spotify.com/authorize?"+
p;

}

updateStatus();

</script>

</body>

</html>
