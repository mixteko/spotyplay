<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"user-read-email",
"playlist-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function refreshApp(){

promptAI.value="";
songs.value="";
playlistName.value="";

"Refrescado";

}

function saveGemini(){

localStorage.setItem(
"gemini_key",
geminiKey.value.trim()
);

updateStatus();

msg(
"Gemini guardada"
);

}

geminiKey.value=
localStorage.getItem(
"gemini_key"
)||"";

function updateStatus(){

spotifyStatus.className=
accessToken?
"status ok":
"status off";

spotifyStatus.innerHTML=
accessToken?
"Spotify 🟢":
"Spotify 🔴";

const g=
localStorage.getItem(
"gemini_key"
);

geminiStatus.className=
g?
"status ok":
"status off";

geminiStatus.innerHTML=
g?
"Gemini 🟢":
"Gemini 🔴";

function cleanSong(song){

song=song
.normalize("NFKC")
.replace(/[\u2018\u2019]/g,"'")
.replace(/[\u201C\u201D]/g,'"')
.replace(/[\u2013\u2014\u2212]/g,"-")
.replace(/^\d+\./,"")
.replace(/\*\*/g,"")
.replace(/\*/g,"")
.replace(/•/g,"")
.replace(/\(.*?\)/g,"")
.trim();

const low=song.toLowerCase();

if(low.includes("aquí tienes")) return "";
if(low.includes("exactamente")) return "";
if(low.includes("canciones")) return "";

return song;

}

async function generateGemini(more=false){

const key=
localStorage.getItem(
"gemini_key"
);

if(!key){
msg("Guardar Gemini");
return;
}

msg("Generando lista...");

try{

const response=
await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:`
Genera EXACTAMENTE ${songCount.value} canciones.

SOLO usa este formato:

ARTISTA - CANCION

Sin numeración.
Sin comentarios.
Sin explicaciones.

Tema:
${promptAI.value}

${more?"No repetir canciones":""}
`
}
]
}
],
generationConfig:{
temperature:0.9,
maxOutputTokens:2048
}
})
}
);

const data=
await response.json();

if(data.error){

msg("Error Gemini:");
msg(JSON.stringify(data.error,null,2));
return;

}

const text=
data.candidates?.[0]
?.content?.parts?.[0]
?.text||"";

if(!text){
msg("Gemini no devolvió canciones");
return;
}

songs.value=text;

msg("Lista generada");

}catch(e){

msg("Error Gemini");
console.log(e);

}

}

msg("Generando lista...");

try{

const response=
await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:`
Genera EXACTAMENTE ${songCount.value} canciones.

SOLO usa este formato:

ARTISTA - CANCION

Sin explicaciones.

Tema:
${promptAI.value}

${more?"No repetir canciones":""}
`
}
]
}
]
})
}
);

const data=
await response.json();

const text=
data.candidates?.[0]
?.content?.parts?.[0]
?.text||"";

songs.value=text;

msg("Lista generada");

}catch(e){

msg("Error Gemini");
console.log(e);

}

}

async function spotifySearch(query){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=10`,
{
headers:{
Authorization:`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks?.items||[];

}

async function searchSong(song){

song=cleanSong(song);

if(!song)
return null;

let queries=[song];

if(song.includes("-")){

const p=song.split("-");

const artist=p[0].trim();

const track=p.slice(1)
.join("-")
.trim();

queries.push(`${artist} ${track}`);
queries.push(`${track} ${artist}`);
queries.push(track);

}

for(const q of queries){

try{

const items=
await spotifySearch(q);

if(items.length){

msg(`OK:\n${song}`);

return items[0].uri;

}

}catch(e){
console.log(e);
}

}

msg(`No encontrada:\n${song}`);

return null;

}

async function createPlaylist(){

if(!accessToken){
msg("Spotify no conectado");
return;
}

msg("Validando token...");

const me=
await fetch(
"https://api.spotify.com/v1/me",
{
headers:{
Authorization:`Bearer ${accessToken}`
}
}
);

if(me.status!==200){
msg("Token inválido");
return;
}

msg("Creando playlist...");

const playlistResponse=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",
headers:{
Authorization:`Bearer ${accessToken}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
name:playlistName.value.trim()||"Playlist",
public:false
})
}
);

const playlist=
await playlistResponse.json();

msg(`Playlist creada:\n${playlist.name}`);

const lines=
songs.value
.split("\n")
.map(cleanSong)
.filter(x=>x);

let uris=[];

for(const line of lines){

const uri=
await searchSong(line);

if(uri){
uris.push(uri);
}

}

uris=[...new Set(uris)];

msg(`Encontradas:\n${uris.length}`);

if(!uris.length){
msg("No agregué canciones");
return;
}

msg("Agregando canciones...");

for(let i=0;i<uris.length;i+=100){

const chunk=
uris.slice(i,i+100);

const addResponse=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",
headers:{
Authorization:`Bearer ${accessToken}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
uris:chunk
})
}
);

const result=
await addResponse.json();

msg(JSON.stringify(result,null,2));

if(result.error){
msg("Spotify rechazó canciones");
return;
}

}

playlistStatus.className="status ok";
playlistStatus.innerHTML="Playlist 🟢";

msg("Canciones agregadas correctamente");

window.open(
playlist.external_urls.spotify,
"_blank"
);

}

function randomString(n){

return [...Array(n)]
.map(()=>Math.random().toString(36)[2])
.join("");

}

async function challenge(v){

const d=new TextEncoder().encode(v);

const h=await crypto.subtle.digest(
"SHA-256",
d
);

return btoa(
String.fromCharCode(...new Uint8Array(h))
)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

localStorage.removeItem("spotify_token");

const verifier=randomString(64);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=await challenge(verifier);

window.location=
"https://accounts.spotify.com/authorize?"+
new URLSearchParams({
client_id:CLIENT_ID,
response_type:"code",
redirect_uri:REDIRECT_URI,
scope:SCOPES,
show_dialog:true,
code_challenge_method:"S256",
code_challenge:c
});

}

async function getToken(){

const code=
new URLSearchParams(location.search)
.get("code");

if(!code){
updateStatus();
return;
}

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({
client_id:CLIENT_ID,
grant_type:"authorization_code",
code,
redirect_uri:REDIRECT_URI,
code_verifier:verifier
});

const r=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body
}
);

const d=
await r.json();

if(d.access_token){

accessToken=d.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

window.history.replaceState(
{},
document.title,
window.location.pathname
);

updateStatus();

msg("Spotify conectado");

}

}

function changeUser(){

localStorage.clear();

window.location.href=
"https://www.spotify.com/logout";

}

updateStatus();
getToken();

</script>
