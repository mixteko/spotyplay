<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Spotify Playlist Creator v1.8
</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:Arial;

background:
linear-gradient(
135deg,
#0f0f0f,
#121212,
#1DB954
);

min-height:100vh;

display:flex;

justify-content:center;

padding:30px;

color:white;

}

.card{

width:100%;

max-width:900px;

background:
rgba(
20,
20,
20,
0.95
);

padding:30px;

border-radius:25px;

box-shadow:
0 0 40px rgba(
0,
0,
0,
0.5
);

}

h1{
margin:0;
color:#1DB954;
}

.version{

display:inline-block;

padding:8px 15px;

margin-top:10px;

background:#1DB954;

color:black;

font-weight:bold;

border-radius:20px;

}

input,
textarea{

width:100%;

margin-top:15px;

padding:15px;

background:#222;

border:none;

border-radius:15px;

color:white;

font-size:15px;

}

textarea{
height:250px;
resize:vertical;
}

.buttons{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:20px;

}

button{

flex:1;

padding:14px;

border:none;

border-radius:15px;

font-weight:bold;

cursor:pointer;

color:white;

font-size:15px;

}

.green{
background:#1DB954;
color:black;
}

.orange{
background:#ff9800;
}

.blue{
background:#2196F3;
}

.red{
background:#e53935;
}

.counter{
margin-top:15px;
font-weight:bold;
}

.progress{

height:12px;

background:#333;

border-radius:20px;

overflow:hidden;

margin-top:10px;

}

.progressFill{

height:100%;

width:0%;

background:#1DB954;

transition:.3s;

}

#log{

margin-top:20px;

padding:20px;

background:#111;

border-radius:20px;

font-family:monospace;

white-space:pre-wrap;

max-height:350px;

overflow:auto;

}

.history{

margin-top:20px;

padding:15px;

background:#191919;

border-radius:15px;

}

.playlistLink{

color:#1DB954;

word-break:break-all;

}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator
</h1>

<div class="version">
Versión v1.8
</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs"
placeholder="Queen - Bohemian Rhapsody
Michael Jackson - Billie Jean">
</textarea>

<div class="counter">

Canciones:
<span id="count">
0
</span>

/100

</div>

<div class="progress">

<div
class="progressFill"
id="progress">
</div>

</div>

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">
Conectar Spotify
</button>

<button
class="orange"
onclick="changeUser()">
Cambiar cuenta
</button>

<button
class="blue"
onclick="createPlaylist()">
Crear playlist
</button>

<button
class="red"
onclick="clearStorage()">
Borrar datos
</button>

</div>

<div id="log">
Esperando conexión
</div>

<div class="history">

<h3>
Historial local
</h3>

<div id="history">
Sin playlists
</div>

</div>

</div>

<script>

const APP_VERSION=
"v1.8";

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=
[
"user-read-private",
"playlist-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

msg(
APP_VERSION
);

function updateCounter(){

let songs=
document
.getElementById(
"songs"
)
.value
.split("\n")
.filter(
x=>x.trim()
);

if(
songs.length>100
){

songs=
songs.slice(
0,
100
);

document
.getElementById(
"songs"
)
.value=
songs.join(
"\n"
);

}

document
.getElementById(
"count"
).innerText=
songs.length;

document
.getElementById(
"progress"
).style.width=
songs.length+
"%";

}

document
.getElementById(
"songs"
)
.addEventListener(
"input",
updateCounter
);

function clearStorage(){

localStorage.clear();

sessionStorage.clear();

location.reload();

}

function changeUser(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

clearStorage();

}

function randomString(n){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let r="";

for(let i=0;i<n;i++){

r+=chars[
Math.floor(
Math.random()*
chars.length
)
];

}

return r;

}

async function challenge(v){

const data=
new TextEncoder()
.encode(v);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return btoa(
String.fromCharCode(
...new Uint8Array(hash)
))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(64);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

const params=
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:
c

});

window.location.href=
"https://accounts.spotify.com/authorize?"+
params.toString();

}

async function getToken(){

const code=
new URLSearchParams(
location.search
).get(
"code"
);

if(!code){

return;

}

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,

grant_type:
"authorization_code",

code,

redirect_uri:
REDIRECT_URI,

code_verifier:
verifier

});

const res=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body
}
);

const data=
await res.json();

accessToken=
data.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

msg(
"Spotify conectado"
);

}

async function searchSong(song){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&market=MX&limit=1`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks
?.items?.[0]
?.uri || null;

}

function saveHistory(name,url){

let h=
JSON.parse(
localStorage.getItem(
"playlist_history"
)||"[]"
);

h.unshift({
name,
url
});

h=
h.slice(0,10);

localStorage.setItem(
"playlist_history",
JSON.stringify(h)
);

renderHistory();

}

function renderHistory(){

const container=
document.getElementById(
"history"
);

const h=
JSON.parse(
localStorage.getItem(
"playlist_history"
)||"[]"
);

if(!h.length){

container.innerHTML=
"Sin playlists";

return;

}

container.innerHTML=
h.map(
x=>`
<div>
<a
class="playlistLink"
href="${x.url}"
target="_blank">
${x.name}
</a>
</div>
`
).join("");

}

async function createPlaylist(){

log.innerHTML="";

msg(
APP_VERSION
);

if(!accessToken){

msg(
"No conectado a Spotify"
);

return;

}

const playlistRes=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

name:
document.getElementById(
"playlistName"
).value,

public:false

})

}
);

const playlist=
await playlistRes.json();

msg(
`HTTP playlist:
${playlistRes.status}`
);

if(!playlistRes.ok){

msg(
JSON.stringify(
playlist,
null,
2
)
);

return;

}

let uris=[];

const missed=[];

const songs=
document
.getElementById(
"songs"
)
.value
.split("\n")
.filter(
x=>x.trim()
);

for(const s of songs){

const uri=
await searchSong(
s
);

if(uri){

uris.push(uri);

msg(
`OK:
${s}`
);

}else{

missed.push(s);

}

}

msg(
`Encontradas:
${uris.length}`
);

const add=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({
uris
})

}
);

msg(
`HTTP canciones:
${add.status}`
);

const result=
await add.json();

msg(
JSON.stringify(
result,
null,
2
)
);

if(add.ok){

msg(
"Playlist completada"
);

saveHistory(
playlist.name,
playlist.external_urls.spotify
);

window.open(
playlist.external_urls.spotify,
"_blank"
);

}

if(missed.length){

msg(
"\nNo encontradas:\n"+
missed.join("\n")
);

}

}

updateCounter();

renderHistory();

getToken();

</script>

</body>
</html>
