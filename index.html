<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Spotify AI v1.16 Turbo
</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css?v=20260610-resolver-total-fix">

</head>

<body>

<div class="container">

<div class="card">

<!-- =========================
HEADER
========================= -->

<div class="header">

<div class="title">

<h1>
SPOTIFY AI
</h1>

<p>
Version 4.0 - Resolver Total Fix
</p>

</div>

<div class="statusRow">

<div
id="spotifyStatus"
class="status disconnected">

Spotify 🔴

</div>

<div
id="geminiStatus"
class="status disconnected">

Gemini 🔴

</div>

<div
id="playlistStatus"
class="status disconnected">

Playlist 🔴

</div>

</div>

</div>

<!-- =========================
GRID
========================= -->

<div class="grid">

<!-- =========================
IA PANEL
========================= -->

<div class="panel">

<h2>
IA GENERATOR
</h2>

<div class="buttonGrid">

<button
id="spotifyBtn"
class="primary">

Conectar Spotify

</button>

<button
id="changeBtn"
class="secondary">

Cambiar Cuenta

</button>

</div>

<textarea
id="promptAI"
placeholder="Ejemplo: Kpop relajante nocturno">
</textarea>

<select id="songCount">

<option value="10">
10 canciones
</option>

<option value="20">
20 canciones
</option>

<option value="40">
40 canciones
</option>

<option value="50">
50 canciones
</option>

<option value="60">
60 canciones
</option>

<option value="80">
80 canciones
</option>

<option value="100">
100 canciones
</option>

<option value="200">
200 canciones
</option>

</select>

<div class="progressWrap">

<div id="songCounter">

0 / 0 canciones

</div>

<div class="progress">

<div
id="progressBar">
</div>

</div>

</div>

<div class="buttonGrid">

<button
id="generateBtn"
class="primary">

Generar Lista

</button>

<button
id="moreBtn"
class="secondary">

Buscar Más

</button>

</div>

</div>

<!-- =========================
PLAYLIST PANEL
========================= -->

<div class="panel">

<h2>
PLAYLIST BUILDER
</h2>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs"
class="songsList"
placeholder="Puedes escribir canciones o pegar links de Spotify, una por línea. Ejemplo: Maná - Rayando el Sol">
</textarea>

<div class="buttonGrid">

<button
id="playlistBtn"
class="primary">

Crear Playlist

</button>

<button
id="refreshBtn"
class="secondary">

Refrescar

</button>

</div>

</div>

</div>

<!-- =========================
LOG
========================= -->

<div
id="log"
class="log">

Esperando conexión...

</div>

</div>

</div>

<script src="app.js?v=20260610-resolver-total-fix"></script>

</body>

</html>
