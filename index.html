<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Playlist Creator AI v4.5</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#050505,#121212,#1DB954);
padding:30px;
color:white;
}

.card{
max-width:1100px;
margin:auto;
background:#111;
padding:30px;
border-radius:25px;
}

.statusBox{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.status{
padding:12px 18px;
border-radius:15px;
font-weight:bold;
}

.green{
background:#1DB954;
color:black;
}

.red{
background:#e53935;
}

input,textarea,select,button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:15px;
}

input,textarea,select{
background:#222;
color:white;
}

textarea{
height:220px;
resize:vertical;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.buttons button{
flex:1;
}

#log{
margin-top:20px;
background:black;
padding:20px;
border-radius:20px;
white-space:pre-wrap;
max-height:360px;
overflow:auto;
}
</style>
</head>

<body>

<div class="card">

<h1>Spotify Playlist Creator AI</h1>

<div>Versión v4.5</div>

<div class="statusBox">

<div id="spotifyStatus" class="status red">
Spotify 🔴
</div>

<div id="deepseekStatus" class="status red">
DeepSeek 🔴
</div>

<div id="playlistStatus" class="status red">
Playlist 🔴
</div>

</div>

<button onclick="loginSpotify()">
Conectar Spotify
</button>

<input
id="deepseekKey"
placeholder="DeepSeek API Key">

<button onclick="saveDeepSeek()">
Guardar DeepSeek
</button>

<textarea
id="promptAI"
placeholder="Kpop relajante">
</textarea>

<select id="songCount">

<option value="10">10</option>
<option value="20">20</option>
<option value="40">40</option>
<option value="50">50</option>
<option value="60">60</option>
<option value="80">80</option>
<option value="100">100</option>
<option value="200">200</option>

</select>

<div class="buttons">

<button onclick="generateDeepSeek()">
Generar Lista
</button>

<button onclick="generateDeepSeek(true)">
Buscar Más
</button>

<button onclick="refreshApp()">
Refrescar
</button>

</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea id="songs"></textarea>

<div class="buttons">

<button onclick="createPlaylist()">
Crear Playlist
</button>

<button onclick="changeUser()">
Cambiar cuenta
</button>

</div>

<div id="log">
Esperando conexión
</div>

</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function refreshApp(){

promptAI.value="";
songs.value="";
playlistName.value="";

log.innerHTML=
"Refrescado";

}

function saveDeepSeek(){

localStorage.setItem(
"deepseek_key",
deepseekKey.value.trim()
);

updateStatus();

msg(
"DeepSeek guardada"
);

}

deepseekKey.value=
localStorage.getItem(
"deepseek_key"
)||"";

function updateStatus(){

spotifyStatus.className=
accessToken?
"status green":
"status red";

spotifyStatus.innerHTML=
accessToken?
"Spotify 🟢":
"Spotify 🔴";

const d=
localStorage.getItem(
"deepseek_key"
);

deepseekStatus.className=
d?
"status green":
"status red";

deepseekStatus.innerHTML=
d?
"DeepSeek 🟢":
"DeepSeek 🔴";

}

function cleanSong(song){

song=song

.replace(/^\d+\./,"")
.replace(/\*\*/g,"")
.replace(/\*/g,"")
.replace(/\(.*?\)/g,"")
.replace(/feat.*$/i,"")
.replace(/ft.*$/i,"")
.replace(/prod.*$/i,"")
.replace(/•/g,"")
.replace(/["']/g,"")
.trim();

const lower=
song.toLowerCase();

if(
lower.includes(
"aquí tienes"
)
)return "";

if(
lower.includes(
"exactamente"
)
)return "";

if(
lower.includes(
"canciones"
)
)return "";

if(
!song.includes("-")
)return "";

return song;

}

async function generateDeepSeek(more=false){

const key=
localStorage.getItem(
"deepseek_key"
);

if(!key){

msg(
"Guardar DeepSeek"
);

return;

}

const count=
songCount.value;

const r=
await fetch(
"https://api.deepseek.com/chat/completions",
{
method:"POST",

headers:{
Authorization:
`Bearer ${key}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({

model:"deepseek-chat",

messages:[
{
role:"user",

content:
`
Genera EXACTAMENTE ${count}

SOLO:

ARTISTA - CANCION

Sin comentarios

Tema:

${promptAI.value}

${more?"No repetir":""}
`
}
]

})

}
);

const d=
await r.json();

songs.value=
d.choices?.[0]
?.message
?.content||
"";

msg(
"Lista generada"
);

}

async function searchSong(song){

song=
cleanSong(song);

if(!song)
return null;

let artist="";
let track="";

if(song.includes("-")){

const p=
song.split("-");

artist=
p[0].trim();

track=
p.slice(1)
.join("-")
.trim();

}

const queries=[

`track:"${track}" artist:"${artist}"`,
`${artist} ${track}`,
`${track} ${artist}`,
track,
song

];

for(
const q
of queries
){

try{

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=5`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

const item=
d.tracks
?.items
?.find(
x=>
x.name &&
x.artists?.length
)
||
d.tracks?.items?.[0];

if(item){

msg(
`OK:
${song}`
);

msg(
item.uri
);

return item.uri;

}

}
catch{}

}

msg(
`No encontrada:
${song}`
);

return null;

}

async function createPlaylist(){

if(!accessToken){

msg(
"Spotify no conectado"
);

return;

}

msg(
"Creando playlist..."
);

const p=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({

name:
playlistName.value.trim()
||
"Playlist",

public:false

})

}
);

const playlist=
await p.json();

const raw=
songs.value
.split("\n");

let uris=[];

for(
const s
of raw
){

const clean=
cleanSong(
s
);

if(!clean)
continue;

const uri=
await searchSong(
clean
);

if(uri){

uris.push(
uri.trim()
);

}

}

uris=[
...new Set(
uris
)
];

msg(
`Encontradas:
${uris.length}`
);

if(
uris.length===0
){

msg(
"No agregué canciones"
);

return;

}

const add=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({
uris
})

}
);

const result=
await add.json();

msg(
JSON.stringify(
result,
null,
2
)
);

if(
result.snapshot_id
){

playlistStatus.className=
"status green";

playlistStatus.innerHTML=
"Playlist 🟢";

msg(
"Canciones agregadas"
);

window.open(
playlist.external_urls.spotify
);

}

}

function randomString(n){

return [...Array(n)]
.map(
()=>Math.random()
.toString(36)[2]
)
.join("");

}

async function challenge(v){

const d=
new TextEncoder()
.encode(v);

const h=
await crypto.subtle.digest(
"SHA-256",
d
);

return btoa(
String.fromCharCode(
...new Uint8Array(h)
))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(
64
);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

window.location=
"https://accounts.spotify.com/authorize?"+
new URLSearchParams({

client_id:
CLIENT_ID,
response_type:
"code",
redirect_uri:
REDIRECT_URI,
scope:
SCOPES,
show_dialog:true,
code_challenge_method:
"S256",
code_challenge:c

});

}

async function getToken(){

const code=
new URLSearchParams(
location.search
).get(
"code"
);

if(!code){

updateStatus();

return;

}

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,
grant_type:
"authorization_code",
code,
redirect_uri:
REDIRECT_URI,
code_verifier:
verifier

});

const r=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body
}
);

const d=
await r.json();

accessToken=
d.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

updateStatus();

msg(
"Spotify conectado"
);

}

function changeUser(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

localStorage.clear();

location.reload();

}

updateStatus();

getToken();

</script>

</body>
</html>
