<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Playlist Creator AI v4.8</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b0b0b,#121212,#1DB954);
color:white;
padding:24px;
}

.card{
max-width:1100px;
margin:auto;
background:#111;
padding:24px;
border-radius:22px;
}

.statusWrap{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.status{
padding:10px 14px;
border-radius:12px;
font-weight:bold;
}

.ok{
background:#1DB954;
color:black;
}

.off{
background:#c62828;
}

input,textarea,select,button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:14px;
box-sizing:border-box;
}

input,textarea,select{
background:#222;
color:white;
}

textarea{
height:220px;
resize:vertical;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.row button{
flex:1;
}

#log{
margin-top:18px;
background:black;
padding:18px;
border-radius:16px;
max-height:320px;
overflow:auto;
white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="card">

<h1>Spotify Playlist Creator AI</h1>
<div>Versión v4.8</div>

<div class="statusWrap">

<div id="spotifyStatus"
class="status off">
Spotify 🔴
</div>

<div id="deepseekStatus"
class="status off">
DeepSeek 🔴
</div>

<div id="playlistStatus"
class="status off">
Playlist 🔴
</div>

</div>

<button onclick="loginSpotify()">
Conectar Spotify
</button>

<input
id="deepseekKey"
placeholder="DeepSeek API Key">

<button onclick="saveDeepSeek()">
Guardar DeepSeek
</button>

<textarea
id="promptAI"
placeholder="Kpop relajante">
</textarea>

<select id="songCount">

<option>10</option>
<option>20</option>
<option>40</option>
<option>50</option>
<option>60</option>
<option>80</option>
<option>100</option>
<option>200</option>

</select>

<div class="row">

<button onclick="generateDeepSeek()">
Generar Lista
</button>

<button onclick="generateDeepSeek(true)">
Buscar Más
</button>

<button onclick="refreshApp()">
Refrescar
</button>

</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea id="songs"></textarea>

<div class="row">

<button onclick="createPlaylist()">
Crear Playlist
</button>

<button onclick="changeUser()">
Cambiar cuenta
</button>

</div>

<div id="log">
Esperando conexión
</div>

</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function refreshApp(){

promptAI.value="";
songs.value="";
playlistName.value="";
log.innerHTML=
"Refrescado";

}

function saveDeepSeek(){

localStorage.setItem(
"deepseek_key",
deepseekKey.value.trim()
);

updateStatus();

msg(
"DeepSeek guardada"
);

}

deepseekKey.value=
localStorage.getItem(
"deepseek_key"
)||"";

function updateStatus(){

spotifyStatus.className=
accessToken?
"status ok":
"status off";

spotifyStatus.innerHTML=
accessToken?
"Spotify 🟢":
"Spotify 🔴";

const d=
localStorage.getItem(
"deepseek_key"
);

deepseekStatus.className=
d?
"status ok":
"status off";

deepseekStatus.innerHTML=
d?
"DeepSeek 🟢":
"DeepSeek 🔴";

}

function cleanSong(line){

line=line
.normalize("NFKC")
.replace(/[\u2018\u2019]/g,"'")
.replace(/[\u201C\u201D]/g,'"')
.replace(/[\u2013\u2014\u2212]/g,"-")
.replace(/^\d+\./,"")
.replace(/\*\*/g,"")
.replace(/\*/g,"")
.replace(/\(.*?\)/g,"")
.replace(/•/g,"")
.trim();

const low=
line.toLowerCase();

if(
low.includes(
"aquí tienes"
)
)return "";

if(
low.includes(
"exactamente"
)
)return "";

if(
low.includes(
"canciones"
)
)return "";

return line;

}

async function generateDeepSeek(more=false){

const key=
localStorage.getItem(
"deepseek_key"
);

if(!key){

msg(
"Guardar DeepSeek"
);

return;

}

const count=
songCount.value;

const r=
await fetch(
"https://api.deepseek.com/chat/completions",
{
method:"POST",

headers:{
Authorization:
`Bearer ${key}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({

model:"deepseek-chat",

messages:[
{
role:"user",
content:
`
Genera EXACTAMENTE ${count} canciones.

Solo:

ARTISTA - CANCION

Tema:

${promptAI.value}

${more?"No repetir":""}
`
}
]

})

}
);

const d=
await r.json();

songs.value=
d.choices?.[0]
?.message
?.content||
"";

msg(
"Lista generada"
);

}

async function spotifySearch(q){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=10`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks?.items||[];

}

async function searchSong(song){

song=
cleanSong(song);

if(!song)
return null;

const normalized=
song.replace(
/[–—]/g,
"-"
);

let queries=[
normalized
];

if(
normalized.includes("-")
){

const p=
normalized.split("-");

const artist=
p[0].trim();

const track=
p.slice(1)
.join("-")
.trim();

queries.push(
`${artist} ${track}`
);

queries.push(
`${track} ${artist}`
);

queries.push(
track
);

}

for(
const q
of queries
){

try{

const items=
await spotifySearch(
q
);

if(
items.length
){

msg(
`OK:
${song}`
);

return items[0].uri;

}

}
catch{}

}

msg(
`No encontrada:
${song}`
);

return null;

}

async function createPlaylist(){

if(!accessToken){

msg(
"Spotify no conectado"
);

return;

}

msg(
"Creando playlist..."
);

const name=
playlistName.value.trim()
||
"Playlist";

const p=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({
name,
public:false
})

}
);

const playlist=
await p.json();

const lines=
songs.value
.split("\n")
.map(
cleanSong
)
.filter(
x=>x
);

let uris=[];

for(
const s
of lines
){

const uri=
await searchSong(
s
);

if(uri){

uris.push(
uri
);

}

}

uris=[
...new Set(
uris
)
];

msg(
`Encontradas:
${uris.length}`
);

if(
uris.length===0
){

msg(
"No agregué canciones"
);

return;

}

const add=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({
uris
})

}
);

const result=
await add.json();

if(
result.snapshot_id
){

playlistStatus.className=
"status ok";

playlistStatus.innerHTML=
"Playlist 🟢";

msg(
"Canciones agregadas"
);

window.open(
playlist.external_urls.spotify
);

}else{

msg(
JSON.stringify(
result,
null,
2
)
);

}

}

function randomString(n){

return [...Array(n)]
.map(
()=>Math.random()
.toString(36)[2]
)
.join("");

}

async function challenge(v){

const d=
new TextEncoder()
.encode(v);

const h=
await crypto.subtle.digest(
"SHA-256",
d
);

return btoa(
String.fromCharCode(
...new Uint8Array(h)
))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(64);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

window.location=
"https://accounts.spotify.com/authorize?"+
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:c

});

}

async function getToken(){

const code=
new URLSearchParams(
location.search
).get(
"code"
);

if(!code){

updateStatus();

return;

}

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,
grant_type:
"authorization_code",
code,
redirect_uri:
REDIRECT_URI,
code_verifier:
verifier

});

const r=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body

}
);

const d=
await r.json();

if(
d.access_token
){

accessToken=
d.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

updateStatus();

msg(
"Spotify conectado"
);

}

}

function changeUser(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

localStorage.clear();

location.reload();

}

updateStatus();

getToken();

</script>

</body>
</html>
