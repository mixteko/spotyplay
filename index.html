<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Spotify Playlist Creator AI v6.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:
radial-gradient(circle at top,#1DB954 0%,#121212 40%,#050505 100%);
min-height:100vh;
color:white;
padding:30px;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:rgba(20,20,20,.9);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.06);
border-radius:30px;
padding:30px;
box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:20px;
margin-bottom:30px;
}

.title h1{
font-size:38px;
font-weight:700;
}

.title p{
opacity:.7;
margin-top:5px;
}

.status-grid{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.status{
padding:12px 18px;
border-radius:16px;
font-size:14px;
font-weight:600;
}

.connected{
background:#1DB954;
color:#000;
}

.disconnected{
background:#ff3b30;
color:white;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.panel{
background:#181818;
border-radius:24px;
padding:24px;
border:1px solid rgba(255,255,255,.05);
}

.panel h2{
margin-bottom:18px;
font-size:20px;
}

input,
textarea,
select{
width:100%;
background:#101010;
border:1px solid rgba(255,255,255,.08);
color:white;
padding:16px;
border-radius:18px;
font-size:15px;
outline:none;
transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
border-color:#1DB954;
box-shadow:0 0 0 3px rgba(29,185,84,.2);
}

textarea{
min-height:220px;
resize:vertical;
}

.space{
height:16px;
}

.btn-group{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:15px;
}

button{
flex:1;
min-width:140px;
border:none;
border-radius:18px;
padding:16px;
font-weight:700;
font-size:15px;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

.primary{
background:#1DB954;
color:black;
}

.secondary{
background:#242424;
color:white;
}

.danger{
background:#ff3b30;
color:white;
}

.log{
margin-top:25px;
background:#0b0b0b;
padding:20px;
border-radius:20px;
height:260px;
overflow:auto;
white-space:pre-wrap;
font-size:14px;
line-height:1.5;
border:1px solid rgba(255,255,255,.06);
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

.header{
flex-direction:column;
align-items:flex-start;
}

}

</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="header">

<div class="title">
<h1>Spotify Playlist Creator</h1>
<p>Versión v6.0 Modern UI</p>
</div>

<div class="status-grid">
<div id="spotifyStatus" class="status disconnected">
Spotify 🔴
</div>
<div id="geminiStatus" class="status disconnected">
Gemini 🔴
</div>
<div id="playlistStatus" class="status disconnected">
Playlist 🔴
</div>
</div>

</div>

<div class="grid">

<div class="panel">
<h2>Configuración IA</h2>

<button id="spotifyBtn" class="primary">
Conectar Spotify
</button>

<div class="space"></div>

<input
id="geminiKey"
placeholder="Gemini API Key">

<div class="btn-group">
<button id="saveGeminiBtn" class="secondary">
Guardar Gemini
</button>
<button id="refreshBtn" class="secondary">
Refrescar
</button>
</div>

<div class="space"></div>

<textarea
id="promptAI"
placeholder="Ejemplo: Kpop relajante nocturno">
</textarea>

<div class="space"></div>

<select id="songCount">
<option value="10">10 canciones</option>
<option value="20">20 canciones</option>
<option value="40">40 canciones</option>
<option value="50">50 canciones</option>
<option value="60">60 canciones</option>
<option value="80">80 canciones</option>
<option value="100">100 canciones</option>
</select>

<div class="btn-group">
<button id="generateBtn" class="primary">
Generar Lista
</button>
<button id="moreBtn" class="secondary">
Buscar Más
</button>
</div>

</div>

<div class="panel">
<h2>Playlist Spotify</h2>

<input
id="playlistName"
placeholder="Nombre playlist">

<div class="space"></div>

<textarea id="songs"></textarea>

<div class="btn-group">
<button id="playlistBtn" class="primary">
Crear Playlist
</button>
<button id="changeBtn" class="danger">
Cambiar Cuenta
</button>
</div>

</div>

</div>

<div id="log" class="log">
Esperando conexión...
</div>

</div>
</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"user-read-email",
"playlist-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem("spotify_token")||"";

const spotifyStatus=document.getElementById("spotifyStatus");
const geminiStatus=document.getElementById("geminiStatus");
const playlistStatus=document.getElementById("playlistStatus");

const geminiKey=document.getElementById("geminiKey");
const promptAI=document.getElementById("promptAI");
const songCount=document.getElementById("songCount");
const playlistName=document.getElementById("playlistName");
const songs=document.getElementById("songs");
const log=document.getElementById("log");

function msg(text){
log.innerHTML += "\n" + text;
log.scrollTop=log.scrollHeight;
}

function setConnected(el,text){
el.className="status connected";
el.innerHTML=text;
}

function setDisconnected(el,text){
el.className="status disconnected";
el.innerHTML=text;
}

function updateStatus(){

if(accessToken){
setConnected(spotifyStatus,"Spotify 🟢");
}else{
setDisconnected(spotifyStatus,"Spotify 🔴");
}

const key=localStorage.getItem("gemini_key");

if(key){
setConnected(geminiStatus,"Gemini 🟢");
}else{
setDisconnected(geminiStatus,"Gemini 🔴");
}

}

function refreshApp(){
promptAI.value="";
songs.value="";
playlistName.value="";
log.innerHTML="Refrescado";
}

function saveGemini(){

localStorage.setItem(
"gemini_key",
geminiKey.value.trim()
);

updateStatus();

msg("Gemini guardada");

}

function cleanSong(song){

song=song
.normalize("NFKC")
.replace(/[\u2018\u2019]/g,"'")
.replace(/[\u201C\u201D]/g,'"')
.replace(/[\u2013\u2014\u2212]/g,"-")
.replace(/^\d+\./,"")
.replace(/\*\*/g,"")
.replace(/\*/g,"")
.replace(/•/g,"")
.replace(/\(.*?\)/g,"")
.trim();

const low=song.toLowerCase();

if(low.includes("aquí tienes")) return "";
if(low.includes("exactamente")) return "";
if(low.includes("canciones")) return "";

return song;

}

async function generateGemini(more=false){

const key=localStorage.getItem("gemini_key");

if(!key){
msg("Guardar Gemini primero");
return;
}

msg("Generando lista...");

try{

const response=await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:`
Genera EXACTAMENTE ${songCount.value} canciones.

Usa SOLAMENTE este formato:

ARTISTA - CANCION

Sin números.
Sin comentarios.
Sin explicaciones.

Tema:
${promptAI.value}

${more?"No repetir canciones":""}
`
}
]
}
],
generationConfig:{
temperature:0.9,
maxOutputTokens:2048
}
})
}
);

const data=await response.json();

if(data.error){
msg(JSON.stringify(data.error,null,2));
return;
}

const text=
data.candidates?.[0]
?.content?.parts?.[0]
?.text||"";

if(!text){
msg("Gemini no devolvió canciones");
return;
}

songs.value=text;

msg("Lista generada correctamente");

}catch(e){
console.log(e);
msg("Error Gemini");
}

}

async function spotifySearch(query){

const r=await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=10`,
{
headers:{
Authorization:`Bearer ${accessToken}`
}
}
);

const d=await r.json();

return d.tracks?.items||[];

}

async function searchSong(song){

song=cleanSong(song);

if(!song) return null;

let queries=[song];

if(song.includes("-")){

const p=song.split("-");

const artist=p[0].trim();
const track=p.slice(1).join("-").trim();

queries.push(`${artist} ${track}`);
queries.push(`${track} ${artist}`);
queries.push(track);

}

for(const q of queries){

try{

const items=await spotifySearch(q);

if(items.length){
msg(`OK: ${song}`);
return items[0].uri;
}

}catch(e){
console.log(e);
}

}

msg(`No encontrada: ${song}`);

return null;

}

async function createPlaylist(){

if(!accessToken){
msg("Spotify no conectado");
return;
}

msg("Creando playlist...");

const finalName=
playlistName.value.trim()||
`${promptAI.value||"Playlist"} Mix`;

const playlistResponse=await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",
headers:{
Authorization:`Bearer ${accessToken}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
name:finalName,
public:false
})
}
);

const playlist=await playlistResponse.json();

if(playlist.error){
msg(JSON.stringify(playlist.error,null,2));
return;
}

msg(`Playlist creada: ${playlist.name}`);

const lines=songs.value
.split("\n")
.map(cleanSong)
.filter(x=>x);

let uris=[];

for(const line of lines){

const uri=await searchSong(line);

if(uri){
uris.push(uri);
}

}

uris=[...new Set(uris)];

msg(`Encontradas: ${uris.length}`);

if(!uris.length){
msg("No agregué canciones");
return;
}

for(let i=0;i<uris.length;i+=100){

const chunk=uris.slice(i,i+100);

const addResponse=await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",
headers:{
Authorization:`Bearer ${accessToken}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
uris:chunk
})
}
);

const result=await addResponse.json();

if(result.error){
msg(JSON.stringify(result.error,null,2));
return;
}

}

setConnected(playlistStatus,"Playlist 🟢");

msg("Canciones agregadas correctamente");

window.open(
playlist.external_urls.spotify,
"_blank"
);

}

function randomString(n){
return [...Array(n)]
.map(()=>Math.random().toString(36)[2])
.join("");
}

async function challenge(v){

const d=new TextEncoder().encode(v);

const h=await crypto.subtle.digest(
"SHA-256",
d
);

return btoa(
String.fromCharCode(...new Uint8Array(h))
)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

localStorage.removeItem("spotify_token");

const verifier=randomString(64);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=await challenge(verifier);

window.location=
"https://accounts.spotify.com/authorize?"+
new URLSearchParams({
client_id:CLIENT_ID,
response_type:"code",
redirect_uri:REDIRECT_URI,
scope:SCOPES,
show_dialog:true,
code_challenge_method:"S256",
code_challenge:c
});

}

async function getToken(){

const code=new URLSearchParams(location.search).get("code");

if(!code){
updateStatus();
return;
}

const verifier=localStorage.getItem("spotify_verifier");

const body=new URLSearchParams({
client_id:CLIENT_ID,
grant_type:"authorization_code",
code,
redirect_uri:REDIRECT_URI,
code_verifier:verifier
});

const r=await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body
}
);

const d=await r.json();

if(d.access_token){

accessToken=d.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

window.history.replaceState(
{},
document.title,
window.location.pathname
);

updateStatus();

msg("Spotify conectado");

}

}

function changeUser(){
localStorage.clear();
window.location.href=
"https://www.spotify.com/logout";
}

document.getElementById("spotifyBtn")
.addEventListener("click",loginSpotify);


document.getElementById("saveGeminiBtn")
.addEventListener("click",saveGemini);


document.getElementById("generateBtn")
.addEventListener("click",()=>generateGemini(false));


document.getElementById("moreBtn")
.addEventListener("click",()=>generateGemini(true));


document.getElementById("refreshBtn")
.addEventListener("click",refreshApp);


document.getElementById("playlistBtn")
.addEventListener("click",createPlaylist);


document.getElementById("changeBtn")
.addEventListener("click",changeUser);


geminiKey.value=
localStorage.getItem("gemini_key")||"";

updateStatus();
getToken();

</script>

</body>
</html>
