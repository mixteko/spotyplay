<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Spotify Playlist Creator AI v2.7</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#050505,
#121212,
#1DB954
);

min-height:100vh;

padding:30px;

display:flex;

justify-content:center;

color:white;
}

.card{
width:100%;
max-width:1000px;

background:
rgba(
15,
15,
15,
0.95
);

padding:30px;

border-radius:25px;

box-shadow:
0 0 40px rgba(
0,
0,
0,
0.5
);
}

h1{
margin:0;
color:#1DB954;
}

.version{
margin-top:10px;

display:inline-block;

padding:8px 15px;

background:#1DB954;

color:black;

font-weight:bold;

border-radius:20px;
}

.statusBox{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:20px;

}

.status{

padding:12px 18px;

border-radius:15px;

font-weight:bold;

min-width:180px;

text-align:center;

}

.greenStatus{
background:#1DB954;
color:black;
}

.redStatus{
background:#e53935;
color:white;
}

input,
textarea,
select{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:15px;

background:#222;

color:white;

font-size:15px;
}

textarea{
height:220px;
resize:vertical;
}

.buttons{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:20px;

}

button{

flex:1;

padding:14px;

border:none;

border-radius:15px;

font-weight:bold;

cursor:pointer;

color:white;

}

.green{
background:#1DB954;
color:black;
}

.orange{
background:#ff9800;
}

.blue{
background:#2196F3;
}

.red{
background:#e53935;
}

#log{

margin-top:20px;

padding:20px;

background:#111;

border-radius:20px;

font-family:monospace;

white-space:pre-wrap;

max-height:350px;

overflow:auto;

}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator AI
</h1>

<div class="version">
Versión v2.7
</div>

<div class="statusBox">

<div
id="spotifyStatus"
class="status redStatus">

Spotify<br>
🔴 Desconectado

</div>

<div
id="geminiStatus"
class="status redStatus">

Gemini<br>
🔴 Sin API

</div>

<div
id="playlistStatus"
class="status redStatus">

Playlist<br>
🔴 No creada

</div>

</div>

<input
id="geminiKey"
placeholder="Gemini API Key">

<button
class="green"
onclick="saveGeminiKey()">

Guardar Gemini

</button>

<textarea
id="promptAI"
placeholder="Rock clásico carretera USA">
</textarea>

<select id="songCount">

<option value="10">
10 canciones
</option>

<option value="25">
25 canciones
</option>

<option value="50">
50 canciones
</option>

<option value="100">
100 canciones
</option>

</select>

<button
class="blue">

Generar IA

</button>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs">
</textarea>

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">

Conectar Spotify

</button>

<button
class="orange"
onclick="changeUser()">

Cambiar cuenta

</button>

<button
class="blue"
onclick="createPlaylist()">

Crear Playlist

</button>

<button
class="red"
onclick="clearStorage()">

Borrar datos

</button>

</div>

<div id="log">

Esperando conexión

</div>

</div>

<script>

const APP_VERSION=
"v2.7";

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=
[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(
" "
);

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

msg(
APP_VERSION
);

function updateStatus(){

const spotify=
document.getElementById(
"spotifyStatus"
);

const gemini=
document.getElementById(
"geminiStatus"
);

if(
accessToken
){

spotify.className=
"status greenStatus";

spotify.innerHTML=
"Spotify<br>🟢 Conectado";

}else{

spotify.className=
"status redStatus";

spotify.innerHTML=
"Spotify<br>🔴 Desconectado";

}

const key=
localStorage.getItem(
"gemini_key"
);

if(
key &&
key.trim()
){

gemini.className=
"status greenStatus";

gemini.innerHTML=
"Gemini<br>🟢 Conectado";

}else{

gemini.className=
"status redStatus";

gemini.innerHTML=
"Gemini<br>🔴 Sin API";

}

}

function updatePlaylistStatus(ok){

const playlist=
document.getElementById(
"playlistStatus"
);

if(ok){

playlist.className=
"status greenStatus";

playlist.innerHTML=
"Playlist<br>🟢 Creada";

}else{

playlist.className=
"status redStatus";

playlist.innerHTML=
"Playlist<br>🔴 No creada";

}

}

function saveGeminiKey(){

const key=
document.getElementById(
"geminiKey"
).value.trim();

localStorage.setItem(
"gemini_key",
key
);

msg(
"Gemini guardada"
);

updateStatus();

}

document.getElementById(
"geminiKey"
).value=
localStorage.getItem(
"gemini_key"
)||"";

function clearStorage(){

localStorage.clear();

sessionStorage.clear();

location.reload();

}

function changeUser(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

clearStorage();

}

function randomString(n){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let r="";

for(
let i=0;
i<n;
i++
){

r+=chars[
Math.floor(
Math.random()*
chars.length
)
];

}

return r;

}

async function challenge(v){

const data=
new TextEncoder()
.encode(v);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return btoa(
String.fromCharCode(
...new Uint8Array(hash)
))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(
64
);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

const params=
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:
c

});

window.location.href=
"https://accounts.spotify.com/authorize?"+
params.toString();

}

async function getToken(){

const code=
new URLSearchParams(
location.search
).get(
"code"
);

if(!code){

updateStatus();

return;

}

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,

grant_type:
"authorization_code",

code,

redirect_uri:
REDIRECT_URI,

code_verifier:
verifier

});

const r=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body
}
);

const d=
await r.json();

accessToken=
d.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

msg(
"Spotify conectado"
);

updateStatus();

}

async function createPlaylist(){

if(
!accessToken
){

msg(
"Spotify no conectado"
);

return;

}

msg(
"Creando playlist..."
);

updatePlaylistStatus(
false
);

const res=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

name:
document.getElementById(
"playlistName"
).value ||

"Playlist IA",

public:false

})

}
);

const playlist=
await res.json();

if(
!res.ok
){

msg(
"Error creando playlist"
);

return;

}

updatePlaylistStatus(
true
);

msg(
"Playlist creada"
);

window.open(
playlist.external_urls.spotify,
"_blank"
);

}

updateStatus();

updatePlaylistStatus(
false
);

getToken();

</script>

</body>

</html>
