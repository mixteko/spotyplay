```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Playlist Creator AI v5.0</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0a0a0a,#121212,#1DB954);

.card{

}

}

}

color:black;
}

.off{
background:#d32f2f;
}

input,
textarea,

button{

}

input,

select{
background:#222;
color:white;

resize:vertical;
}

display:flex;
gap:10px;

}

flex:1;
}

margin-top:20px;

}
</style>
</head>

<body>

<div class="card">

<h1>Spotify Playlist Creator AI</h1>
<div>Versión v5.0</div>

<div class="statusWrap">
<div id="spotifyStatus" class="status off">Spotify 🔴</div>
<div id="deepseekStatus" class="status off">DeepSeek 🔴</div>
<div id="playlistStatus" class="status off">Playlist 🔴</div>
</div>

<button onclick="loginSpotify()">Conectar Spotify</button>

<input id="deepseekKey" placeholder="DeepSeek API Key">
<button onclick="saveDeepSeek()">Guardar DeepSeek</button>

<textarea id="promptAI" placeholder="Rock latino relajante"></textarea>

<select id="songCount">
<option>10</option>
<option>20</option>
<option>40</option>
<option>50</option>
<option>60</option>
<option>80</option>
<option>100</option>
<option>200</option>
</select>

<div class="row">
<button onclick="generateDeepSeek()">Generar Lista</button>
<button onclick="generateDeepSeek(true)">Buscar Más</button>
<button onclick="refreshApp()">Refrescar</button>
</div>

<input id="playlistName" placeholder="Nombre playlist">

<textarea id="songs"></textarea>

<div class="row">
<button onclick="createPlaylist()">Crear Playlist</button>
<button onclick="changeUser()">Cambiar cuenta</button>
</div>

<div id="log">Esperando conexión</div>

</div>

<script>

const CLIENT_ID="6c398ae66eae4f84959cfce08bd0c74c";
const REDIRECT_URI="https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=localStorage.getItem("spotify_token")||"";

const log=document.getElementById("log");

function msg(t){
log.innerHTML += "\n"+t;
log.scrollTop=log.scrollHeight;
}

function refreshApp(){
promptAI.value="";
songs.value="";
playlistName.value="";
log.innerHTML="Refrescado";
}

function saveDeepSeek(){
localStorage.setItem(
"deepseek_key",
deepseekKey.value.trim()
);
updateStatus();
msg("DeepSeek guardada");
}

deepseekKey.value=localStorage.getItem("deepseek_key")||"";

function updateStatus(){
spotifyStatus.className=accessToken?"status ok":"status off";
spotifyStatus.innerHTML=accessToken?"Spotify 🟢":"Spotify 🔴";

const d=localStorage.getItem("deepseek_key");

deepseekStatus.className=d?"status ok":"status off";
deepseekStatus.innerHTML=d?"DeepSeek 🟢":"DeepSeek 🔴";
}

function cleanSong(song){

song=song
.normalize("NFKC")
.replace(/[\u2018\u2019]/g,"'")
.replace(/[\u201C\u201D]/g,'"')
.replace(/[\u2013\u2014\u2212]/g,"-")
.replace(/^\d+\./,"")
.replace(/\*\*/g,"")
.replace(/\*/g,"")
.replace(/•/g,"")
.replace(/\(.*?\)/g,"")
.trim();

const lower=song.toLowerCase();

if(lower.includes("aquí tienes")) return "";
if(lower.includes("exactamente")) return "";
if(lower.includes("canciones")) return "";

return song;
}

async function generateDeepSeek(more=false){

const key=localStorage.getItem("deepseek_key");

if(!key){
msg("Guardar DeepSeek");
return;
}

msg("Generando lista...");

const count=songCount.value;

const r=await fetch(
"https://api.deepseek.com/chat/completions",
{
method:"POST",
headers:{
Authorization:`Bearer ${key}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
model:"deepseek-chat",
messages:[
{
role:"user",
content:`
Genera EXACTAMENTE ${count} canciones.

SOLO usa este formato:

ARTISTA - CANCION

Tema:
${promptAI.value}

${more?"No repetir canciones":""}
`
}
]
})
}
);

const d=await r.json();

songs.value=d.choices?.[0]?.message?.content||"";

msg("Lista generada");
}

async function spotifySearch(query){

const r=await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=10`,
{
headers:{
Authorization:`Bearer ${accessToken}`
}
}
);

const d=await r.json();
return d.tracks?.items||[];
}

async function searchSong(song){

song=cleanSong(song);

if(!song) return null;

const normalized=song.replace(/[–—]/g,"-");

let queries=[normalized];

if(normalized.includes("-")){

const parts=normalized.split("-");

const artist=parts[0].trim();
const track=parts.slice(1).join("-").trim();

queries.push(`${artist} ${track}`);
queries.push(`${track} ${artist}`);
queries.push(track);
}

for(const q of queries){

try{

const items=await spotifySearch(q);

if(items.length>0){

const first=items[0];

msg(`OK:\n${song}`);
msg(`URI:\n${first.uri}`);

return first.uri;
}

}catch(e){
console.log(e);
}
}

msg(`No encontrada:\n${song}`);
return null;
}

async function createPlaylist(){

if(!accessToken){
msg("Spotify no conectado");
return;
}

playlistStatus.className="status off";
playlistStatus.innerHTML="Playlist 🔴";

msg("Creando playlist...");

const playlistResponse=await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",
headers:{
Authorization:`Bearer ${accessToken}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
name:playlistName.value.trim()||"Playlist",
public:false
})
}
);

const playlist=await playlistResponse.json();

msg(`Playlist creada:\n${playlist.name}`);

const lines=songs.value
.split("\n")
.map(cleanSong)
.filter(x=>x);

let uris=[];

for(const line of lines){

const uri=await searchSong(line);

if(uri){
uris.push(uri);
}
}

uris=[...new Set(uris)];

msg(`Encontradas:\n${uris.length}`);

if(uris.length===0){
msg("No agregué canciones");
return;
}

msg("Agregando canciones...");

const addResponse=await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/tracks`,
{
method:"POST",
headers:{
Authorization:`Bearer ${accessToken}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
uris:uris
})
}
);

const addResult=await addResponse.json();

msg(JSON.stringify(addResult,null,2));

if(addResult.snapshot_id){

playlistStatus.className="status ok";
playlistStatus.innerHTML="Playlist 🟢";

msg("Canciones agregadas correctamente");

window.open(
playlist.external_urls.spotify,
"_blank"
);

}else{

msg("Spotify rechazó canciones");
}
}

function randomString(n){
return [...Array(n)]
.map(()=>Math.random().toString(36)[2])
.join("");
}

async function challenge(v){

const d=new TextEncoder().encode(v);

const h=await crypto.subtle.digest(
"SHA-256",
d
);

return btoa(
String.fromCharCode(...new Uint8Array(h))
)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");
}

async function loginSpotify(){

const verifier=randomString(64);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=await challenge(verifier);

window.location=
"https://accounts.spotify.com/authorize?"+
new URLSearchParams({
client_id:CLIENT_ID,
response_type:"code",
redirect_uri:REDIRECT_URI,
scope:SCOPES,
show_dialog:true,
code_challenge_method:"S256",
code_challenge:c
});
}

async function getToken(){

const code=new URLSearchParams(location.search).get("code");

if(!code){
updateStatus();
return;
}

const verifier=localStorage.getItem("spotify_verifier");

const body=new URLSearchParams({
client_id:CLIENT_ID,
grant_type:"authorization_code",
code,
redirect_uri:REDIRECT_URI,
code_verifier:verifier
});

const r=await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body
}
);

const d=await r.json();

if(d.access_token){

accessToken=d.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

updateStatus();

msg("Spotify conectado");
}
}

function changeUser(){
window.open(
"https://www.spotify.com/logout/",
"_blank"
);
localStorage.clear();
location.reload();
}

updateStatus();
getToken();

</script>

</body>
</html>
