<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Playlist Creator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#121212;
  color:white;
  font-family:Arial,sans-serif;
  max-width:900px;
  margin:auto;
  padding:30px;
}
h1{color:#1DB954;font-size:24px;margin-bottom:20px}
input,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  font-size:15px;
  background:#2a2a2a;
  color:#fff;
}
textarea{height:220px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button{
  padding:12px 22px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  color:#fff;
  font-size:14px;
  font-weight:500;
}
.green{background:#1DB954}
.orange{background:#ff9800}
.blue{background:#2196F3}
.red{background:#e53935}
#log{
  margin-top:20px;
  padding:16px;
  background:#1a1a1a;
  border-radius:10px;
  font-size:13px;
  font-family:monospace;
  white-space:pre-wrap;
  max-height:300px;
  overflow-y:auto;
  border:1px solid #333;
}
.ok{color:#1DB954}
.err{color:#ff4444}
.info{color:#64b5f6}
.warn{color:#ffb74d}
</style>
</head>
<body>

<h1>Spotify Playlist Creator</h1>

<input id="playlistName" placeholder="Nombre de la playlist">
<textarea id="songs" placeholder="Michael Jackson - Billie Jean
Queen - Bohemian Rhapsody
Bad Bunny - Tití Me Preguntó"></textarea>

<div class="btns">
  <button class="green" onclick="loginSpotify()">Conectar Spotify</button>
  <button class="orange" onclick="changeSpotifyUser()">Cambiar cuenta</button>
  <button class="blue" onclick="createPlaylist()">Crear Playlist</button>
  <button class="red" onclick="clearTokens()">Limpiar sesión</button>
</div>

<div id="log">Sin conectar...</div>

<script>
const CLIENT_ID = "6c398ae66eae4f84959cfce08bd0c74c";
const REDIRECT_URI = "https://mixteko.github.io/spotyplay/";
const SCOPES = [
  "playlist-modify-private",
  "playlist-modify-public",
  "playlist-read-private",
  "playlist-read-collaborative",
  "user-read-private",
  "user-read-email",
  "user-library-read",
  "user-library-modify"
].join(" ");

let accessToken = localStorage.getItem("spotify_token") || "";
const log = document.getElementById("log");

function addLog(msg, cls="") {
  const line = document.createElement("div");
  line.className = cls;
  line.textContent = msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function clearLog() { log.innerHTML = ""; }

function clearTokens() {
  localStorage.clear();
  accessToken = "";
  clearLog();
  addLog("Sesión limpiada. Haz clic en Conectar Spotify.", "warn");
}

function randomString(n) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  return Array.from({length:n}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
}

async function challenge(v) {
  const data = new TextEncoder().encode(v);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return btoa(String.fromCharCode(...new Uint8Array(hash)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"");
}

async function loginSpotify() {
  localStorage.removeItem("spotify_token");
  localStorage.removeItem("spotify_verifier");
  accessToken = "";
  const verifier = randomString(64);
  localStorage.setItem("spotify_verifier", verifier);
  const c = await challenge(verifier);
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    show_dialog: "true",
    code_challenge_method: "S256",
    code_challenge: c
  });
  window.location = "https://accounts.spotify.com/authorize?" + params;
}

function changeSpotifyUser() {
  localStorage.clear();
  accessToken = "";
  window.open("https://www.spotify.com/logout/", "_blank");
  setTimeout(loginSpotify, 1500);
}

async function getToken() {
  const code = new URLSearchParams(window.location.search).get("code");
  if (!code) {
    if (accessToken) {
      clearLog();
      addLog("Token encontrado. Listo para crear playlists.", "ok");
      addLog("Si da error, haz clic en 'Limpiar sesión' y luego 'Conectar Spotify'.", "warn");
    }
    return;
  }

  clearLog();
  addLog("Intercambiando código por token...", "info");

  const verifier = localStorage.getItem("spotify_verifier");
  if (!verifier) {
    addLog("Error: no se encontró el verifier. Haz clic en Conectar Spotify.", "err");
    return;
  }

  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: "authorization_code",
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  try {
    const res = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body
    });
    const data = await res.json();
    if (!res.ok || !data.access_token) {
      addLog("Error al obtener token: " + JSON.stringify(data), "err");
      return;
    }
    accessToken = data.access_token;
    localStorage.setItem("spotify_token", accessToken);
    if (data.refresh_token) {
      localStorage.setItem("spotify_refresh", data.refresh_token);
    }
    history.replaceState(null, "", window.location.pathname);
    addLog("Spotify conectado correctamente.", "ok");
  } catch(e) {
    addLog("Error de red: " + e.message, "err");
  }
}

async function spotifyFetch(url, options={}) {
  const res = await fetch(url, {
    ...options,
    headers: {
      "Authorization": `Bearer ${accessToken}`,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  let data;
  try { data = await res.json(); } catch(e) { data = {}; }

  if (!res.ok) throw new Error(`${res.status} — ${JSON.stringify(data)}`);
  return data;
}

async function searchSong(song) {
  const data = await spotifyFetch(
    `https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&limit=5`
  );
  return data.tracks?.items?.[0]?.uri || null;
}

async function createPlaylist() {
  const name = document.getElementById("playlistName").value.trim();
  const songs = document.getElementById("songs").value
    .split("\n").map(x => x.trim()).filter(x => x);

  clearLog();

  if (!accessToken) {
    addLog("No hay token. Haz clic en 'Conectar Spotify' primero.", "err");
    return;
  }
  if (!name) { addLog("Escribe un nombre para la playlist.", "warn"); return; }
  if (!songs.length) { addLog("Agrega al menos una canción.", "warn"); return; }

  try {
    addLog("Verificando token...", "info");
    const me = await spotifyFetch("https://api.spotify.com/v1/me");
    addLog(`Usuario: ${me.display_name || me.id} | Plan: ${me.product}`, "ok");

    addLog("Creando playlist...", "info");
    const playlist = await spotifyFetch("https://api.spotify.com/v1/me/playlists", {
      method: "POST",
      body: JSON.stringify({
        name,
        public: true,
        collaborative: false,
        description: "Creada con Spotify Playlist Creator"
      })
    });

    if (!playlist.id) { addLog("No se pudo crear la playlist.", "err"); return; }
    addLog(`Playlist creada: "${playlist.name}"`, "ok");

    let uris = [];
    let missed = [];

    for (let i = 0; i < songs.length; i++) {
      addLog(`Buscando (${i+1}/${songs.length}): ${songs[i]}`, "info");
      try {
        const uri = await searchSong(songs[i]);
        if (uri) { uris.push(uri); addLog(`  Encontrada`, "ok"); }
        else { missed.push(songs[i]); addLog(`  No encontrada`, "warn"); }
      } catch(e) {
        missed.push(songs[i]);
        addLog(`  Error: ${e.message}`, "err");
      }
    }

    if (uris.length === 0) { addLog("No se encontró ninguna canción.", "warn"); return; }

    addLog(`Agregando ${uris.length} canciones...`, "info");
    for (let i = 0; i < uris.length; i += 100) {
      const batch = uris.slice(i, i + 100);
      await spotifyFetch(
        `https://api.spotify.com/v1/playlists/${playlist.id}/tracks`,
        { method: "POST", body: JSON.stringify({uris: batch}) }
      );
      addLog(`  Lote ${Math.floor(i/100)+1} agregado (${batch.length} canciones)`, "ok");
    }

    addLog(`\nListo. Agregadas: ${uris.length} | No encontradas: ${missed.length}`, "ok");
    if (missed.length) addLog("No encontradas:\n" + missed.join("\n"), "warn");

    window.open(playlist.external_urls.spotify, "_blank");

  } catch(e) {
    addLog("Error: " + e.message, "err");
    if (e.message.includes("401") || e.message.includes("403")) {
      addLog("Haz clic en 'Limpiar sesión' y luego 'Conectar Spotify'.", "warn");
      localStorage.removeItem("spotify_token");
      accessToken = "";
    }
  }
}

getToken();
</script>
</body>
</html>
