<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Playlist Creator</title>

<style>
body{
background:#121212;
color:white;
font-family:Arial;
max-width:900px;
margin:auto;
padding:30px;
}

h1{
color:#1DB954;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
background:#222;
color:white;
}

textarea{
height:240px;
}

button{
padding:12px;
margin-right:10px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
color:white;
}

.green{background:#1DB954;}
.orange{background:#ff9800;}
.blue{background:#2196F3;}
.red{background:#e53935;}

#log{
margin-top:20px;
padding:15px;
background:#1a1a1a;
border-radius:10px;
white-space:pre-wrap;
font-family:monospace;
max-height:350px;
overflow:auto;
}
</style>

</head>

<body>

<h1>Spotify Playlist Creator</h1>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs"
placeholder="Hall & Oates - Rich Girl
Queen - Bohemian Rhapsody
Michael Jackson - Billie Jean">
</textarea>

<button class="green"
onclick="loginSpotify()">
Conectar Spotify
</button>

<button class="orange"
onclick="resetSpotify()">
Reiniciar permisos
</button>

<button class="blue"
onclick="createPlaylist()">
Crear Playlist
</button>

<button class="red"
onclick="clearStorage()">
Borrar almacenamiento
</button>

<div id="log">
Esperando conexión
</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=
[
"playlist-modify-private",
"playlist-modify-public",
"playlist-read-private",
"user-read-private"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function clearStorage(){

localStorage.clear();

sessionStorage.clear();

accessToken="";

location.reload();

}

function resetSpotify(){

clearStorage();

}

function randomString(n){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let r="";

for(let i=0;i<n;i++){

r+=chars[
Math.floor(
Math.random()*
chars.length
)
];

}

return r;

}

async function challenge(v){

const data=
new TextEncoder()
.encode(v);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return btoa(
String.fromCharCode(
...new Uint8Array(hash)
)
)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(64);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

const params=
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:
c

});

window.location.href=
"https://accounts.spotify.com/authorize?"+
params.toString();

}

async function getToken(){

const code=
new URLSearchParams(
location.search
).get(
"code"
);

if(!code)return;

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,

grant_type:
"authorization_code",

code,

redirect_uri:
REDIRECT_URI,

code_verifier:
verifier

});

const res=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body
}
);

const data=
await res.json();

accessToken=
data.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

history.replaceState(
{},
"",
REDIRECT_URI
);

msg(
"Spotify conectado"
);

}

async function searchSong(song){

try{

let artist="";
let track="";

if(song.includes("-")){

const p=
song.split("-");

artist=
p[0]
.trim()
.replace(/&/g," ");

track=
p.slice(1)
.join("-")
.trim()
.replace(/"/g,"");

}

const queries=[

`track:${track} artist:${artist}`,

`${track} ${artist}`,

song

];

for(const q of queries){

msg(
`Buscar:
${q}`
);

const res=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(
q
)}&type=track&market=MX&limit=5`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const data=
await res.json();

if(
data.tracks &&
data.tracks.items &&
data.tracks.items.length
){

const found=
data.tracks
.items[0];

msg(
`Encontrada:
${found.name}
-
${found.artists[0].name}`
);

return found.uri;

}

}

return null;

}catch(e){

msg(
e.message
);

return null;

}

}

async function createPlaylist(){

log.innerHTML="";

const playlistName=
document
.getElementById(
"playlistName"
)
.value
.trim();

const songs=
document
.getElementById(
"songs"
)
.value
.split("\n")
.filter(
x=>x.trim()
);

const playlistRes=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({

name:
playlistName,

public:false

})

}
);

const playlist=
await playlistRes.json();

msg(
"Playlist creada"
);

let uris=[];

for(const s of songs){

const uri=
await searchSong(
s
);

if(uri){

uris.push(uri);

}

}

msg(
`Canciones encontradas:
${uris.length}`
);

if(!uris.length){

return;

}

const add=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/tracks`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({
uris
})

}
);

const result=
await add.json();

msg(
JSON.stringify(
result,
null,
2
)
);

if(result.snapshot_id){

msg(
"Playlist finalizada"
);

window.open(
playlist.external_urls.spotify,
"_blank"
);

}

}

getToken();

</script>

</body>
</html>
