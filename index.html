<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify Playlist Creator AI v1.13 Turbo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<div class="title">

<h1>SPOTIFY AI</h1>

<p>Version 1.13 Turbo</p>

</div>

<div class="statusRow">

<div id="spotifyStatus"
class="status disconnected">

Spotify 🔴

</div>

<div id="geminiStatus"
class="status disconnected">

Gemini 🔴

</div>

<div id="playlistStatus"
class="status disconnected">

Playlist 🔴

</div>

</div>

</div>

<div class="grid">

<div class="panel">

<h2>IA GENERATOR</h2>

<button
id="spotifyBtn"
class="primary">

Conectar Spotify

</button>

<input
id="geminiKey"
placeholder="Gemini API Key">

<div class="buttonGrid">

<button
id="saveGeminiBtn"
class="secondary">

Guardar Gemini

</button>

<button
id="refreshBtn"
class="secondary">

Refrescar

</button>

</div>

<textarea
id="promptAI"
placeholder="Ejemplo: Kpop relajante nocturno">
</textarea>

<select id="songCount">

<option value="10">10 canciones</option>
<option value="20">20 canciones</option>
<option value="40">40 canciones</option>
<option value="50">50 canciones</option>
<option value="60">60 canciones</option>
<option value="80">80 canciones</option>
<option value="100">100 canciones</option>

</select>

<div class="progressWrap">

<div id="songCounter">

0 / 0 canciones

</div>

<div class="progress">

<div id="progressBar"></div>

</div>

</div>

<div class="buttonGrid">

<button
id="generateBtn"
class="primary">

Generar Lista

</button>

<button
id="moreBtn"
class="secondary">

Buscar Más

</button>

</div>

</div>

<div class="panel">

<h2>PLAYLIST BUILDER</h2>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs">
</textarea>

<div class="buttonGrid">

<button
id="playlistBtn"
class="primary">

Crear Playlist

</button>

<button
id="changeBtn"
class="danger">

Cambiar Cuenta

</button>

</div>

</div>

</div>

<div
id="log"
class="log">

Esperando conexión...

</div>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
