<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Spotify Playlist Creator AI v2.8</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#050505,
#121212,
#1DB954
);

min-height:100vh;

padding:30px;

display:flex;

justify-content:center;

color:white;
}

.card{

width:100%;

max-width:1100px;

background:
rgba(
15,
15,
15,
0.95
);

padding:30px;

border-radius:25px;

}

.version{
background:#1DB954;
color:black;
padding:8px 15px;
display:inline-block;
border-radius:20px;
font-weight:bold;
}

.statusBox{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.status{
padding:12px 20px;
border-radius:15px;
font-weight:bold;
min-width:180px;
text-align:center;
}

.greenStatus{
background:#1DB954;
color:black;
}

.redStatus{
background:#e53935;
}

input,
textarea,
select{

width:100%;

padding:14px;

margin-top:15px;

background:#222;

border:none;

border-radius:15px;

color:white;

}

textarea{
height:220px;
resize:vertical;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

button{
flex:1;
padding:14px;
border:none;
border-radius:15px;
cursor:pointer;
font-weight:bold;
color:white;
}

.green{
background:#1DB954;
color:black;
}

.orange{
background:#ff9800;
}

.blue{
background:#2196F3;
}

.red{
background:#e53935;
}

#log{
margin-top:20px;
padding:20px;
background:#111;
border-radius:20px;
white-space:pre-wrap;
font-family:monospace;
max-height:350px;
overflow:auto;
}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator AI
</h1>

<div class="version">
Versión v2.8
</div>

<div class="statusBox">

<div
id="spotifyStatus"
class="status redStatus">

Spotify<br>
🔴

</div>

<div
id="geminiStatus"
class="status redStatus">

Gemini<br>
🔴

</div>

<div
id="playlistStatus"
class="status redStatus">

Playlist<br>
🔴

</div>

</div>

<input
id="geminiKey"
placeholder="Gemini API Key">

<button
class="green"
onclick="saveGeminiKey()">

Guardar IA

</button>

<textarea
id="promptAI"
placeholder="Rock clásico carretera USA">
</textarea>

<select id="songCount">

<option value="10">10</option>
<option value="25">25</option>
<option value="50">50</option>

</select>

<div class="buttons">

<button
class="blue"
onclick="generateAIPlaylist()">

Generar IA

</button>

<button
class="orange"
onclick="generateAIPlaylist()">

Buscar más

</button>

</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs">
</textarea>

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">

Conectar Spotify

</button>

<button
class="orange"
onclick="changeUser()">

Cambiar cuenta

</button>

<button
class="blue"
onclick="createPlaylist()">

Crear Playlist

</button>

<button
class="red"
onclick="clearStorage()">

Borrar

</button>

</div>

<div id="log">
Esperando conexión
</div>

</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function saveGeminiKey(){

localStorage.setItem(
"gemini_key",
document.getElementById(
"geminiKey"
).value
);

updateStatus();

msg(
"Gemini guardada"
);

}

document.getElementById(
"geminiKey"
).value=
localStorage.getItem(
"gemini_key"
)||"";

function updateStatus(){

document.getElementById(
"spotifyStatus"
).className=
accessToken ?
"status greenStatus":
"status redStatus";

document.getElementById(
"spotifyStatus"
).innerHTML=
accessToken ?
"Spotify<br>🟢":
"Spotify<br>🔴";

const g=
localStorage.getItem(
"gemini_key"
);

document.getElementById(
"geminiStatus"
).className=
g ?
"status greenStatus":
"status redStatus";

document.getElementById(
"geminiStatus"
).innerHTML=
g ?
"Gemini<br>🟢":
"Gemini<br>🔴";

}

function randomString(n){

const c=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let r="";

for(let i=0;i<n;i++){

r +=
c[
Math.floor(
Math.random()*
c.length
)
];

}

return r;

}

async function challenge(v){

const d=
new TextEncoder()
.encode(v);

const h=
await crypto.subtle.digest(
"SHA-256",
d
);

return btoa(
String.fromCharCode(
...new Uint8Array(h)
))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(
64
);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

const params=
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:
c

});

window.location=
"https://accounts.spotify.com/authorize?"+
params;

}

async function getToken(){

const code=
new URLSearchParams(
location.search
).get(
"code"
);

if(!code){

updateStatus();

return;

}

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,

grant_type:
"authorization_code",

code,

redirect_uri:
REDIRECT_URI,

code_verifier:
verifier

});

const r=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body
}
);

const d=
await r.json();

accessToken=
d.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

msg(
"Spotify conectado"
);

updateStatus();

}

async function generateAIPlaylist(){

const key=
localStorage.getItem(
"gemini_key"
);

if(!key){

msg(
"Guardar Gemini"
);

return;

}

msg(
"Generando..."
);

const prompt=
document.getElementById(
"promptAI"
).value;

const count=
document.getElementById(
"songCount"
).value;

const r=
await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

contents:[
{
parts:[
{
text:
`Genera ${count} canciones

Formato:

ARTISTA - CANCION

Tema:

${prompt}

Sin numeración`
}
]
}
]

})

}
);

const d=
await r.json();

document.getElementById(
"songs"
).value=
d.candidates?.[0]
?.content
?.parts?.[0]
?.text||"";

msg(
"IA lista"
);

}

async function searchSong(song){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&limit=1`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks
?.items?.[0]
?.uri||null;

}

async function createPlaylist(){

msg(
"Creando playlist..."
);

const p=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

name:
document.getElementById(
"playlistName"
).value ||

"Playlist IA",

public:false

})

}
);

const playlist=
await p.json();

let uris=[];

let missed=[];

const songs=
document
.getElementById(
"songs"
)
.value
.split(
"\n"
)
.filter(
x=>x.trim()
);

for(
let i=0;
i<songs.length;
i++
){

msg(
`${i+1}/${songs.length}`
);

const uri=
await searchSong(
songs[i]
);

if(uri){

uris.push(
uri
);

}else{

missed.push(
songs[i]
);

}

}

msg(
`Encontradas:
${uris.length}`
);

if(
missed.length
){

msg(
`No encontradas:
${missed.join("\n")}`
);

}

const add=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({
uris
})

}
);

if(add.ok){

document.getElementById(
"playlistStatus"
).className=
"status greenStatus";

document.getElementById(
"playlistStatus"
).innerHTML=
"Playlist<br>🟢";

window.open(
playlist.external_urls.spotify,
"_blank"
);

msg(
"Playlist completa"
);

}

}

function changeUser(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

clearStorage();

}

function clearStorage(){

localStorage.clear();

sessionStorage.clear();

location.reload();

}

updateStatus();

getToken();

</script>

</body>

</html>
