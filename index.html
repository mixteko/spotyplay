<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Playlist Creator</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#121212;
color:white;
font-family:Arial,sans-serif;
max-width:900px;
margin:auto;
padding:30px;
}

h1{
color:#1DB954;
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
background:#222;
color:white;
font-size:15px;
}

textarea{
height:240px;
resize:vertical;
}

.btns{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:10px;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
color:white;
}

.green{background:#1DB954;}
.orange{background:#ff9800;}
.blue{background:#2196F3;}
.red{background:#e53935;}

#log{
margin-top:20px;
padding:15px;
background:#1a1a1a;
border-radius:10px;
white-space:pre-wrap;
font-family:monospace;
max-height:350px;
overflow:auto;
}

.ok{color:#1DB954;}
.err{color:#ff5252;}
.info{color:#64b5f6;}
.warn{color:#ffb74d;}
</style>
</head>

<body>

<h1>Spotify Playlist Creator</h1>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs"
placeholder="Michael Jackson - Billie Jean
Queen - Bohemian Rhapsody
Bad Bunny - Tití Me Preguntó">
</textarea>

<div class="btns">

<button class="green"
onclick="loginSpotify()">
Conectar Spotify
</button>

<button class="orange"
onclick="changeSpotifyUser()">
Cambiar cuenta
</button>

<button class="blue"
onclick="createPlaylist()">
Crear Playlist
</button>

<button class="red"
onclick="clearSession()">
Limpiar sesión
</button>

</div>

<div id="log">
Esperando conexión...
</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=
[
"playlist-modify-private",
"playlist-modify-public",
"user-read-private"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function addLog(msg,cls=""){

const d=
document.createElement(
"div"
);

d.className=cls;

d.textContent=msg;

log.appendChild(d);

log.scrollTop=
log.scrollHeight;

}

function clearLog(){

log.innerHTML="";

}

function clearSession(){

localStorage.clear();

accessToken="";

clearLog();

addLog(
"Sesión eliminada",
"warn"
);

}

function randomString(n){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let r="";

for(let i=0;i<n;i++){

r+=chars[
Math.floor(
Math.random()*
chars.length
)
];

}

return r;

}

async function createChallenge(v){

const data=
new TextEncoder()
.encode(v);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return btoa(
String.fromCharCode(
...new Uint8Array(hash)
)
)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

clearLog();

addLog(
"Iniciando login",
"info"
);

const verifier=
randomString(64);

localStorage.setItem(
"spotify_verifier",
verifier
);

const challenge=
await createChallenge(
verifier
);

const params=
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:
true,

code_challenge_method:
"S256",

code_challenge:
challenge

});

window.location.href=
"https://accounts.spotify.com/authorize?"+
params.toString();

}

function changeSpotifyUser(){

clearSession();

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

setTimeout(
loginSpotify,
1500
);

}

async function getToken(){

const code=
new URLSearchParams(
window.location.search
)
.get(
"code"
);

if(!code){

if(accessToken){

addLog(
"Spotify conectado",
"ok"
);

}

return;

}

addLog(
"Intercambiando token",
"info"
);

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,

grant_type:
"authorization_code",

code,

redirect_uri:
REDIRECT_URI,

code_verifier:
verifier

});

const res=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body
}
);

const data=
await res.json();

if(!data.access_token){

addLog(
JSON.stringify(data),
"err"
);

return;

}

accessToken=
data.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

history.replaceState(
{},
"",
REDIRECT_URI
);

addLog(
"Spotify conectado",
"ok"
);

}

async function spotifyFetch(url,opt={}){

const res=
await fetch(
url,
{
...opt,

headers:{

Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json",

...(opt.headers||{})

}

}
);

const data=
await res.json();

if(!res.ok){

throw new Error(
JSON.stringify(data)
);

}

return data;

}

async function searchSong(song){

const q=
encodeURIComponent(
song
);

const data=
await spotifyFetch(
`https://api.spotify.com/v1/search?q=${q}&type=track&limit=3`
);

return data.tracks
?.items?.[0]
?.uri || null;

}

async function createPlaylist(){

clearLog();

const name=
document
.getElementById(
"playlistName"
)
.value
.trim();

const songs=
document
.getElementById(
"songs"
)
.value
.split("\n")
.map(
x=>x.trim()
)
.filter(
x=>x
);

if(!accessToken){

addLog(
"Conecta Spotify primero",
"err"
);

return;

}

if(!name){

addLog(
"Escribe nombre playlist",
"warn"
);

return;

}

addLog(
"Creando playlist",
"info"
);

const playlist=
await spotifyFetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

body:
JSON.stringify({

name,

public:true

})

}
);

addLog(
"Playlist creada",
"ok"
);

let uris=[];

for(let i=0;i<songs.length;i++){

addLog(
`Buscando:
${songs[i]}`,
"info"
);

const uri=
await searchSong(
songs[i]
);

if(uri){

uris.push(uri);

addLog(
"Encontrada",
"ok"
);

}else{

addLog(
"No encontrada",
"warn"
);

}

}

if(!uris.length){

addLog(
"No encontré canciones",
"warn"
);

return;

}

addLog(
`Agregando ${uris.length}`,
"info"
);

await spotifyFetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/tracks`,
{
method:"POST",

body:
JSON.stringify({
uris
})

}
);

addLog(
"Playlist finalizada",
"ok"
);

window.open(
playlist.external_urls.spotify,
"_blank"
);

}

getToken();

</script>

</body>
</html>
