<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Spotify Playlist Creator AI v2.0</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#0a0a0a,
#121212,
#1DB954
);

min-height:100vh;

padding:30px;

display:flex;

justify-content:center;

color:white;
}

.card{

width:100%;

max-width:1000px;

background:
rgba(
15,
15,
15,
0.95
);

padding:30px;

border-radius:25px;

box-shadow:
0 0 50px rgba(
0,
0,
0,
0.5
);

}

h1{
margin:0;
color:#1DB954;
}

.version{

margin-top:10px;

display:inline-block;

padding:8px 15px;

background:#1DB954;

color:black;

font-weight:bold;

border-radius:20px;

}

input,
textarea,
select{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:15px;

background:#222;

color:white;

font-size:15px;

}

textarea{
height:220px;
resize:vertical;
}

.buttons{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:20px;

}

button{

flex:1;

padding:14px;

border:none;

border-radius:15px;

font-weight:bold;

cursor:pointer;

color:white;

}

.green{
background:#1DB954;
color:black;
}

.orange{
background:#ff9800;
}

.blue{
background:#2196F3;
}

.red{
background:#e53935;
}

.counter{
margin-top:15px;
font-weight:bold;
}

.progress{

height:12px;

background:#333;

border-radius:20px;

overflow:hidden;

margin-top:10px;

}

.progressFill{

height:100%;

width:0%;

background:#1DB954;

transition:.3s;

}

#log{

margin-top:20px;

padding:20px;

background:#111;

border-radius:20px;

font-family:monospace;

white-space:pre-wrap;

max-height:320px;

overflow:auto;

}

.history{

margin-top:20px;

padding:15px;

background:#191919;

border-radius:15px;

}

.link{
color:#1DB954;
}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator AI
</h1>

<div class="version">
Versión v2.0
</div>

<input
id="geminiKey"
placeholder="Gemini API Key">

<button
class="green"
onclick="saveGeminiKey()">
Guardar API Gemini
</button>

<textarea
id="promptAI"
placeholder="Ej:
Rock clásico carretera USA
Música mexicana relajante
Pop 80s gimnasio">
</textarea>

<select id="songCount">

<option value="10">
10 canciones
</option>

<option value="25">
25 canciones
</option>

<option value="50">
50 canciones
</option>

<option value="100">
100 canciones
</option>

</select>

<button
class="blue"
onclick="generateAIPlaylist()">
Generar con IA
</button>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs"
placeholder="Canciones IA">
</textarea>

<div class="counter">

Canciones:
<span id="count">
0
</span>

/100

</div>

<div class="progress">

<div
id="progress"
class="progressFill">
</div>

</div>

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">
Conectar Spotify
</button>

<button
class="orange"
onclick="changeUser()">
Cambiar cuenta
</button>

<button
class="blue"
onclick="createPlaylist()">
Crear Playlist
</button>

<button
class="red"
onclick="clearStorage()">
Borrar datos
</button>

</div>

<div id="log">
Esperando conexión
</div>

<div class="history">

<h3>
Historial
</h3>

<div id="history">
Sin playlists
</div>

</div>

</div>

<script>

const APP_VERSION=
"v2.0";

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

msg(
APP_VERSION
);

function updateCounter(){

let songs=
document
.getElementById(
"songs"
)
.value
.split("\n")
.filter(
x=>x.trim()
);

if(
songs.length>100
){

songs=
songs.slice(
0,
100
);

document
.getElementById(
"songs"
)
.value=
songs.join(
"\n"
);

}

document
.getElementById(
"count"
).innerText=
songs.length;

document
.getElementById(
"progress"
).style.width=
songs.length+
"%";

}

document
.getElementById(
"songs"
)
.addEventListener(
"input",
updateCounter
);

function saveGeminiKey(){

localStorage.setItem(
"gemini_key",
document.getElementById(
"geminiKey"
).value
);

msg(
"Gemini guardada"
);

}

document.getElementById(
"geminiKey"
).value=
localStorage.getItem(
"gemini_key"
)||"";

async function generateAIPlaylist(){

const key=
localStorage.getItem(
"gemini_key"
);

if(!key){

msg(
"Guardar Gemini API"
);

return;

}

msg(
"Generando..."
);

const prompt=
document.getElementById(
"promptAI"
).value;

const count=
document.getElementById(
"songCount"
).value;

const body={

contents:[
{
parts:[
{
text:
`Genera EXACTAMENTE ${count} canciones.

Formato:
ARTISTA - CANCION

Tema:
${prompt}

Sin numerar.
Sin explicación.`
}
]
}
]

};

const r=
await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(
body
)

}
);

const d=
await r.json();

const text=
d.candidates?.[0]
?.content
?.parts?.[0]
?.text||"";

document.getElementById(
"songs"
).value=
text;

updateCounter();

msg(
"Playlist IA lista"
);

}

function clearStorage(){

localStorage.clear();

sessionStorage.clear();

location.reload();

}

function changeUser(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

clearStorage();

}

function randomString(n){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let r="";

for(let i=0;i<n;i++){

r+=chars[
Math.floor(
Math.random()*
chars.length
)
];

}

return r;

}

async function challenge(v){

const data=
new TextEncoder()
.encode(v);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return btoa(
String.fromCharCode(
...new Uint8Array(hash)
))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(64);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

const params=
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:c

});

window.location.href=
"https://accounts.spotify.com/authorize?"+
params.toString();

}

async function getToken(){

const code=
new URLSearchParams(
location.search
).get(
"code"
);

if(!code)return;

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,

grant_type:
"authorization_code",

code,

redirect_uri:
REDIRECT_URI,

code_verifier:
verifier

});

const res=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body
}
);

const data=
await res.json();

accessToken=
data.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

msg(
"Spotify conectado"
);

}

async function searchSong(song){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&market=MX&limit=1`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks?.items?.[0]?.uri||null;

}

async function createPlaylist(){

log.innerHTML="";

msg(
"Creando playlist"
);

const playlistRes=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"
},

body:
JSON.stringify({

name:
document.getElementById(
"playlistName"
).value,

public:false

})

}
);

const playlist=
await playlistRes.json();

let uris=[];

const songs=
document
.getElementById(
"songs"
)
.value
.split("\n")
.filter(
x=>x.trim()
);

for(const s of songs){

const uri=
await searchSong(
s
);

if(uri){

uris.push(uri);

}

}

const add=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"
},

body:
JSON.stringify({
uris
})

}
);

if(add.ok){

window.open(
playlist.external_urls.spotify,
"_blank"
);

msg(
"Playlist creada"
);

}

}

updateCounter();

getToken();

</script>

</body>
</html>
