<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Spotify Playlist Creator AI v4.2
</title>

<style>

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#050505,
#121212,
#1DB954
);

padding:30px;
color:white;
}

.card{
max-width:1100px;
margin:auto;
background:#111;
padding:30px;
border-radius:25px;
}

.statusBox{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.status{
padding:12px 18px;
border-radius:15px;
font-weight:bold;
}

.green{
background:#1DB954;
color:black;
}

.red{
background:#e53935;
}

input,
textarea,
select,
button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:15px;
}

input,
textarea,
select{
background:#222;
color:white;
}

textarea{
height:220px;
resize:vertical;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.buttons button{
flex:1;
}

#log{
margin-top:20px;
background:black;
padding:20px;
border-radius:20px;
white-space:pre-wrap;
max-height:350px;
overflow:auto;
}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator AI
</h1>

<div>
Versión v4.2
</div>

<div class="statusBox">

<div
id="spotifyStatus"
class="status red">

Spotify 🔴

</div>

<div
id="deepseekStatus"
class="status red">

DeepSeek 🔴

</div>

<div
id="playlistStatus"
class="status red">

Playlist 🔴

</div>

</div>

<button onclick="loginSpotify()">
Conectar Spotify
</button>

<input
id="deepseekKey"
placeholder="DeepSeek API Key">

<button onclick="saveDeepSeek()">
Guardar DeepSeek
</button>

<textarea
id="promptAI"
placeholder="Kpop relajante">
</textarea>

<select id="songCount">

<option>10</option>
<option>20</option>
<option>40</option>
<option>50</option>
<option>60</option>
<option>80</option>
<option>100</option>
<option>200</option>

</select>

<div class="buttons">

<button onclick="generateDeepSeek()">
Generar Lista
</button>

<button onclick="generateDeepSeek(true)">
Buscar Más
</button>

<button onclick="refreshApp()">
Refrescar
</button>

</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea id="songs"></textarea>

<div class="buttons">

<button onclick="createPlaylist()">
Crear Playlist
</button>

<button onclick="changeUser()">
Cambiar cuenta
</button>

</div>

<div id="log">
Esperando conexión
</div>

</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function refreshApp(){

document.getElementById(
"promptAI"
).value="";

document.getElementById(
"songs"
).value="";

document.getElementById(
"playlistName"
).value="";

log.innerHTML=
"Refrescado";

}

function saveDeepSeek(){

localStorage.setItem(
"deepseek_key",
document.getElementById(
"deepseekKey"
).value.trim()
);

updateStatus();

}

document.getElementById(
"deepseekKey"
).value=
localStorage.getItem(
"deepseek_key"
)||"";

function updateStatus(){

document.getElementById(
"spotifyStatus"
).className=
accessToken?
"status green":
"status red";

document.getElementById(
"spotifyStatus"
).innerHTML=
accessToken?
"Spotify 🟢":
"Spotify 🔴";

const d=
localStorage.getItem(
"deepseek_key"
);

document.getElementById(
"deepseekStatus"
).className=
d?
"status green":
"status red";

document.getElementById(
"deepseekStatus"
).innerHTML=
d?
"DeepSeek 🟢":
"DeepSeek 🔴";

}

function cleanSong(song){

return song

.replace(/^\d+\./,"")
.replace(/\*\*/g,"")
.replace(/\*/g,"")
.replace(/\(.*?\)/g,"")
.replace(/feat.*$/i,"")
.replace(/ft.*$/i,"")
.replace(/prod.*$/i,"")
.replace(/•/g,"")
.trim();

}

async function generateDeepSeek(more=false){

const key=
localStorage.getItem(
"deepseek_key"
);

const count=
document.getElementById(
"songCount"
).value;

const r=
await fetch(
"https://api.deepseek.com/chat/completions",
{
method:"POST",

headers:{
Authorization:
`Bearer ${key}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({

model:
"deepseek-chat",

messages:[
{
role:"user",

content:
`
Genera EXACTAMENTE
${count}

canciones

SOLO:

ARTISTA - CANCION

Tema:

${document.getElementById(
"promptAI"
).value}

${
more?
"No repetir":
""
}
`
}
]

})

}
);

const d=
await r.json();

document.getElementById(
"songs"
).value=
d.choices?.[0]
?.message
?.content||
"";

msg(
"Lista generada"
);

}

async function searchQuery(q){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=5`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks
?.items||
[];

}

async function searchSong(song){

song=
cleanSong(song);

let artist="";
let track="";

if(
song.includes("-")
){

const p=
song.split("-");

artist=
p[0].trim();

track=
p.slice(1)
.join("-")
.trim();

}

const queries=[

`track:"${track}" artist:"${artist}"`,

`${artist} ${track}`,

`${track} ${artist}`,

track,

song

];

for(
const q
of queries
){

try{

const items=
await searchQuery(
q
);

if(
items.length
){

msg(
`OK:
${song}`
);

return items[0].uri;

}

}
catch{}

}

msg(
`No encontrada:
${song}`
);

return null;

}

async function createPlaylist(){

if(!accessToken){

msg(
"Spotify no conectado"
);

return;

}

const name=
document.getElementById(
"playlistName"
).value.trim() ||
"Playlist";

msg(
"Creando playlist..."
);

const p=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({
name,
public:false
})

}
);

const playlist=
await p.json();

const songs=
document
.getElementById(
"songs"
)
.value
.split("\n")
.filter(
x=>x.trim()
);

let uris=[];

for(
const s
of songs
){

const uri=
await searchSong(
s
);

if(uri){

uris.push(
uri
);

}

}

msg(
`Encontradas:
${uris.length}`
);

if(
uris.length===0
){

msg(
"No agregué canciones"
);

return;

}

const add=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({
uris
})

}
);

const result=
await add.json();

if(
result.snapshot_id
){

msg(
"Canciones agregadas"
);

document.getElementById(
"playlistStatus"
).className=
"status green";

document.getElementById(
"playlistStatus"
).innerHTML=
"Playlist 🟢";

}

window.open(
playlist.external_urls.spotify
);

}

function randomString(n){

return [...Array(n)]
.map(
()=>Math.random()
.toString(36)[2]
)
.join("");

}

async function challenge(v){

const d=
new TextEncoder()
.encode(v);

const h=
await crypto.subtle.digest(
"SHA-256",
d
);

return btoa(
String.fromCharCode(
...new Uint8Array(h)
))
replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(
64
);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

window.location=
"https://accounts.spotify.com/authorize?"+
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:c

});

}

async function getToken(){

const code=
new URLSearchParams(
location.search
).get(
"code"
);

if(!code){

updateStatus();

return;

}

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,

grant_type:
"authorization_code",

code,

redirect_uri:
REDIRECT_URI,

code_verifier:
verifier

});

const r=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body

}
);

const d=
await r.json();

accessToken=
d.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

updateStatus();

msg(
"Spotify conectado"
);

}

function changeUser(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

localStorage.clear();

location.reload();

}

updateStatus();

getToken();

</script>

</body>

</html>
