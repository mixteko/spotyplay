<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Spotify Playlist Creator AI v3.3</title>

<style>

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#050505,
#121212,
#1DB954
);

padding:30px;
color:white;
}

.card{
max-width:1100px;
margin:auto;
background:#111;
padding:30px;
border-radius:25px;
}

.statusBox{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.status{
padding:10px 18px;
border-radius:15px;
font-weight:bold;
}

.green{
background:#1DB954;
color:black;
}

.red{
background:#e53935;
}

.orange{
background:#ff9800;
color:black;
}

input,
textarea,
select,
button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:15px;
}

textarea{
height:220px;
background:#222;
color:white;
}

input,
select{
background:#222;
color:white;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.buttons button{
flex:1;
}

#log{
margin-top:20px;
background:black;
padding:20px;
border-radius:20px;
white-space:pre-wrap;
max-height:300px;
overflow:auto;
}

#history{
margin-top:20px;
background:#1a1a1a;
padding:20px;
border-radius:20px;
}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator AI
</h1>

<div>
Versión v3.3
</div>

<div class="statusBox">

<div
id="spotifyStatus"
class="status red">

Spotify 🔴

</div>

<div
id="geminiStatus"
class="status red">

Gemini 🔴

</div>

<div
id="localStatus"
class="status orange">

IA Local 🟡

</div>

<div
id="playlistStatus"
class="status red">

Playlist 🔴

</div>

</div>

<input
id="geminiKey"
placeholder="Gemini API Key">

<button
class="green"
onclick="saveGemini()">

Guardar Gemini

</button>

<select id="mode">

<option value="auto">
Automático
</option>

<option value="gemini">
Gemini
</option>

<option value="local">
IA Local
</option>

</select>

<textarea
id="promptAI"
placeholder="Rock carretera USA">
</textarea>

<div class="buttons">

<button
class="orange"
onclick="generateSongs()">

Generar

</button>

<button
class="orange"
onclick="generateSongs(true)">

Buscar más

</button>

</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs">
</textarea>

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">

Conectar Spotify

</button>

<button
class="orange"
onclick="changeUser()">

Cambiar cuenta

</button>

<button
class="green"
onclick="createPlaylist()">

Crear Playlist

</button>

</div>

<div id="log">
Esperando conexión
</div>

<div id="history">
Sin historial
</div>

</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function saveGemini(){

localStorage.setItem(
"gemini_key",
document.getElementById(
"geminiKey"
).value
);

updateStatus();

msg(
"Gemini guardada"
);

}

document.getElementById(
"geminiKey"
).value=
localStorage.getItem(
"gemini_key"
)||"";

const localAI={

rock:[
"Queen - Bohemian Rhapsody",
"Journey - Faithfully",
"Eagles - Hotel California",
"Boston - More Than a Feeling",
"Tom Petty - Free Fallin'",
"Bruce Springsteen - Born to Run"
],

gym:[
"Survivor - Eye of the Tiger",
"Europe - Final Countdown",
"Bon Jovi - Livin on a Prayer",
"Queen - We Will Rock You"
],

mex:[
"Carin León - Primera Cita",
"Grupo Firme - Ya Supérame",
"Christian Nodal - Adiós Amor",
"Peso Pluma - Ella Baila Sola"
]

};

let rotate=0;

function localGenerate(){

rotate++;

const prompt=
document.getElementById(
"promptAI"
).value
.toLowerCase();

let base=
localAI.rock;

if(
prompt.includes(
"gym"
)
){

base=
localAI.gym;

}

if(
prompt.includes(
"mex"
)
||
prompt.includes(
"regional"
)
){

base=
localAI.mex;

}

return [

...base.slice(
rotate%
base.length
),

...base.slice(
0,
rotate%
base.length
)

];

}

async function generateSongs(){

const mode=
document.getElementById(
"mode"
).value;

if(
mode==="local"
){

useLocal();

return;

}

try{

throw new Error(
"429"
);

}
catch{

useLocal();

}

}

function useLocal(){

const songs=
localGenerate();

document.getElementById(
"songs"
).value=
songs.join(
"\n"
);

document.getElementById(
"localStatus"
).className=
"status green";

document.getElementById(
"localStatus"
).innerHTML=
"IA Local 🟢";

msg(
"IA Local usada"
);

}

async function searchSong(song){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&limit=1`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks
?.items?.[0]
?.uri||null;

}

async function createPlaylist(){

if(
!accessToken
){

msg(
"Spotify no conectado"
);

return;

}

msg(
"Creando playlist..."
);

const p=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

name:
document.getElementById(
"playlistName"
).value ||

"Playlist AI",

public:false

})

}
);

const playlist=
await p.json();

const songs=
document
.getElementById(
"songs"
)
.value
.split(
"\n"
)
.filter(
x=>x.trim()
);

let uris=[];

for(
const s
of songs
){

msg(
`Buscar:
${s}`
);

const uri=
await searchSong(
s
);

if(uri){

uris.push(
uri
);

}

}

await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({
uris
})

}
);

window.open(
playlist.external_urls.spotify
);

document.getElementById(
"playlistStatus"
).className=
"status green";

document.getElementById(
"playlistStatus"
).innerHTML=
"Playlist 🟢";

saveHistory(
playlist.name
);

msg(
"Playlist creada"
);

}

function saveHistory(name){

let h=
JSON.parse(
localStorage.getItem(
"history"
)||"[]"
);

h.unshift(
name
);

h=
h.slice(
0,
10
);

localStorage.setItem(
"history",
JSON.stringify(
h
)
);

renderHistory();

}

function renderHistory(){

const h=
JSON.parse(
localStorage.getItem(
"history"
)||"[]"
);

document.getElementById(
"history"
).innerHTML=
h.join(
"<br>"
);

}

function updateStatus(){

document.getElementById(
"spotifyStatus"
).className=
accessToken ?
"status green":
"status red";

document.getElementById(
"spotifyStatus"
).innerHTML=
accessToken ?
"Spotify 🟢":
"Spotify 🔴";

const g=
localStorage.getItem(
"gemini_key"
);

document.getElementById(
"geminiStatus"
).className=
g ?
"status green":
"status red";

document.getElementById(
"geminiStatus"
).innerHTML=
g ?
"Gemini 🟢":
"Gemini 🔴";

}

function randomString(n){

return [...Array(n)]
.map(
()=>Math.random()
.toString(36)[2]
)
.join("");

}

async function challenge(v){

const d=
new TextEncoder()
.encode(v);

const h=
await crypto.subtle.digest(
"SHA-256",
d
);

return btoa(
String.fromCharCode(
...new Uint8Array(h)
))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(
64
);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

const p=
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:c

});

window.location=
"https://accounts.spotify.com/authorize?"+
p;

}

async function getToken(){

const code=
new URLSearchParams(
location.search
).get(
"code"
);

if(!code){

updateStatus();

return;

}

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,

grant_type:
"authorization_code",

code,

redirect_uri:
REDIRECT_URI,

code_verifier:
verifier

});

const r=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body
}
);

const d=
await r.json();

accessToken=
d.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

updateStatus();

msg(
"Spotify conectado"
);

}

renderHistory();

updateStatus();

getToken();

</script>

</body>

</html>
