<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Spotify Playlist Creator AI v2.4
</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#0a0a0a,
#121212,
#1DB954
);

min-height:100vh;

padding:30px;

display:flex;

justify-content:center;

color:white;
}

.card{

width:100%;

max-width:1000px;

background:
rgba(
15,
15,
15,
0.95
);

padding:30px;

border-radius:25px;

}

.version{
display:inline-block;
padding:8px 15px;
background:#1DB954;
color:black;
font-weight:bold;
border-radius:20px;
}

input,
textarea,
select{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:15px;

background:#222;

color:white;

}

textarea{
height:220px;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

button{
flex:1;
padding:14px;
border:none;
border-radius:15px;
font-weight:bold;
cursor:pointer;
color:white;
}

.green{
background:#1DB954;
color:black;
}

.orange{
background:#ff9800;
}

.blue{
background:#2196F3;
}

.red{
background:#e53935;
}

#log{
margin-top:20px;
padding:20px;
background:#111;
border-radius:20px;
font-family:monospace;
white-space:pre-wrap;
max-height:350px;
overflow:auto;
}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator AI
</h1>

<div class="version">
Versión v2.4
</div>

<input
id="geminiKey"
placeholder="Gemini API Key">

<button
class="green"
onclick="saveGeminiKey()">
Guardar IA
</button>

<textarea
id="promptAI"
placeholder="Rock clásico carretera">
</textarea>

<select id="songCount">

<option value="10">10</option>
<option value="25">25</option>
<option value="50">50</option>
<option value="100">100</option>

</select>

<button
class="blue"
onclick="generateAIPlaylist()">
Generar IA
</button>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs">
</textarea>

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">
Conectar Spotify
</button>

<button
class="orange"
onclick="changeUser()">
Cambiar cuenta
</button>

<button
class="blue"
onclick="createPlaylist()">
Crear Playlist
</button>

<button
class="red"
onclick="clearStorage()">
Borrar
</button>

</div>

<div id="log">
Esperando conexión
</div>

</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=
[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

msg(
"v2.4"
);

function saveGeminiKey(){

localStorage.setItem(
"gemini_key",
document.getElementById(
"geminiKey"
).value
);

msg(
"Gemini guardada"
);

}

document.getElementById(
"geminiKey"
).value=
localStorage.getItem(
"gemini_key"
)||"";

async function generateAIPlaylist(){

const key=
localStorage.getItem(
"gemini_key"
);

const prompt=
document.getElementById(
"promptAI"
).value;

const count=
document.getElementById(
"songCount"
).value;

msg(
"Generando IA..."
);

const r=
await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

contents:[
{
parts:[
{
text:
`Genera ${count} canciones.

Formato:

ARTISTA - CANCION

Tema:
${prompt}`
}
]
}
]

})

}
);

const d=
await r.json();

document.getElementById(
"songs"
).value=
d.candidates?.[0]
?.content
?.parts?.[0]
?.text||"";

msg(
"IA lista"
);

}

async function searchSong(song){

msg(
`Buscar:
${song}`
);

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&limit=1`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks
?.items?.[0]
?.uri||null;

}

async function createPlaylist(){

log.innerHTML="";

msg(
"Creando playlist..."
);

const p=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

name:
document.getElementById(
"playlistName"
).value,

public:false

})

}
);

const playlist=
await p.json();

msg(
"Playlist creada"
);

const songs=
document
.getElementById(
"songs"
)
.value
.split(
"\n"
)
.filter(
x=>x.trim()
);

let uris=[];

for(
let i=0;
i<songs.length;
i++
){

msg(
`${i+1}/${songs.length}`
);

const uri=
await searchSong(
songs[i]
);

if(uri){

uris.push(
uri
);

}

}

msg(
`Encontradas:
${uris.length}`
);

const add=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({
uris
})

}
);

msg(
`HTTP:
${add.status}`
);

if(add.ok){

window.open(
playlist.external_urls.spotify,
"_blank"
);

msg(
"Terminada"
);

}

}

getToken();

</script>

</body>
</html>
