<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Spotify Playlist Creator v1.6
</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:Arial;

background:
linear-gradient(
135deg,
#0f0f0f,
#121212,
#1DB954
);

min-height:100vh;

color:white;

display:flex;

justify-content:center;

padding:30px;

}

.card{

width:100%;

max-width:850px;

background:
rgba(
20,
20,
20,
0.95
);

padding:30px;

border-radius:25px;

box-shadow:
0 0 40px rgba(
0,
0,
0,
0.4
);

}

h1{

margin:0;

color:#1DB954;

}

.version{

margin-top:10px;

display:inline-block;

padding:8px 15px;

border-radius:20px;

background:#1DB954;

color:black;

font-weight:bold;

}

input,
textarea{

width:100%;

margin-top:15px;

padding:15px;

border:none;

border-radius:15px;

background:#222;

color:white;

font-size:15px;

}

textarea{

height:250px;

resize:vertical;

}

.buttons{

display:flex;

flex-wrap:wrap;

gap:10px;

margin-top:20px;

}

button{

flex:1;

padding:14px;

border:none;

border-radius:15px;

cursor:pointer;

font-weight:bold;

color:white;

}

.green{
background:#1DB954;
color:black;
}

.orange{
background:#ff9800;
}

.blue{
background:#2196F3;
}

.red{
background:#e53935;
}

.counter{

margin-top:15px;

font-weight:bold;

}

.progress{

width:100%;

height:14px;

background:#333;

border-radius:20px;

overflow:hidden;

margin-top:10px;

}

.progressFill{

height:100%;

width:0%;

background:#1DB954;

transition:.3s;

}

#log{

margin-top:20px;

padding:20px;

background:#111;

border-radius:20px;

white-space:pre-wrap;

font-family:monospace;

max-height:350px;

overflow:auto;

}

.history{

margin-top:20px;

padding:15px;

background:#191919;

border-radius:15px;

}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator
</h1>

<div class="version">
Versión v1.6
</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs"
placeholder="Queen - Bohemian Rhapsody
Michael Jackson - Billie Jean">
</textarea>

<div class="counter">

Canciones:
<span id="count">
0
</span>

/100

</div>

<div class="progress">

<div
class="progressFill"
id="progress">
</div>

</div>

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">
Conectar
</button>

<button
class="orange"
onclick="changeUser()">
Cambiar cuenta
</button>

<button
class="blue"
onclick="createPlaylist()">
Crear playlist
</button>

<button
class="red"
onclick="clearStorage()">
Borrar
</button>

</div>

<div id="log">
Esperando conexión
</div>

<div class="history">

<h3>
Historial local
</h3>

<div id="history">

Sin playlists

</div>

</div>

</div>

<script>

const APP_VERSION=
"v1.6";

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=
[
"user-read-private",
"playlist-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function updateCounter(){

let songs=
document
.getElementById(
"songs"
)
.value
.split("\n")
.filter(
x=>x.trim()
);

if(
songs.length>100
){

songs=
songs.slice(
0,
100
);

document
.getElementById(
"songs"
)
.value=
songs.join(
"\n"
);

}

document
.getElementById(
"count"
)
innerText=
songs.length;

document
.getElementById(
"progress"
)
.style.width=
songs.length+
"%";

}

document
.getElementById(
"songs"
)
.addEventListener(
"input",
updateCounter
);

function clearStorage(){

localStorage.clear();

sessionStorage.clear();

location.reload();

}

function changeUser(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

clearStorage();

}

async function loginSpotify(){

changeUser();

}

async function searchSong(song){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&market=MX&limit=1`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks
?.items?.[0]
?.uri||null;

}

async function createPlaylist(){

log.innerHTML="";

msg(
APP_VERSION
);

msg(
"Creando playlist..."
);

}

updateCounter();

</script>

</body>
</html>
