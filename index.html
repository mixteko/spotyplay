<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Spotify Playlist Creator v1.4
</title>

<style>

body{
background:#121212;
color:white;
font-family:Arial;
max-width:900px;
margin:auto;
padding:30px;
}

h1{
color:#1DB954;
}

#versionBox{
display:inline-block;
padding:8px 12px;
background:#1DB954;
color:black;
font-weight:bold;
border-radius:8px;
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
background:#222;
color:white;
}

textarea{
height:240px;
}

button{
padding:12px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
color:white;
}

.green{background:#1DB954;}
.orange{background:#ff9800;}
.blue{background:#2196F3;}
.red{background:#e53935;}

#log{
margin-top:20px;
padding:15px;
background:#1a1a1a;
border-radius:10px;
font-family:monospace;
white-space:pre-wrap;
max-height:450px;
overflow:auto;
}

</style>

</head>

<body>

<h1>
Spotify Playlist Creator
</h1>

<div id="versionBox">
Versión v1.4
</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs"
placeholder="Queen - Bohemian Rhapsody
Michael Jackson - Billie Jean">
</textarea>

<button class="green"
onclick="loginSpotify()">
Conectar Spotify
</button>

<button class="orange"
onclick="clearStorage()">
Borrar almacenamiento
</button>

<button class="blue"
onclick="createPlaylist()">
Crear Playlist
</button>

<button class="red"
onclick="logoutSpotify()">
Cerrar Spotify
</button>

<div id="log">
Esperando conexión
</div>

<script>

const APP_VERSION="v1.4";

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

}

function clearStorage(){

localStorage.clear();

sessionStorage.clear();

location.reload();

}

function logoutSpotify(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

clearStorage();

}

async function searchSong(song){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&market=MX&limit=1`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks
?.items?.[0]
?.uri||null;

}

async function createPlaylist(){

log.innerHTML="";

msg(
APP_VERSION
);

const playlistRes=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

name:
document.getElementById(
"playlistName"
).value,

public:false

})

}
);

const playlist=
await playlistRes.json();

msg(
`HTTP playlist:
${playlistRes.status}`
);

let uris=[];

const songs=
document
.getElementById(
"songs"
)
.value
.split("\n")
.filter(
x=>x.trim()
);

for(
const s of songs
){

const uri=
await searchSong(s);

if(uri){

uris.push(uri);

}

}

msg(
`Encontradas:
${uris.length}`
);

const add=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({
uris
})

}
);

msg(
`HTTP canciones:
${add.status}`
);

const result=
await add.text();

msg(
result
);

}

</script>

</body>

</html>
