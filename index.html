<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Spotify Playlist Creator AI v2.1
</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#0a0a0a,
#121212,
#1DB954
);

min-height:100vh;

padding:30px;

display:flex;

justify-content:center;

color:white;
}

.card{
width:100%;
max-width:1000px;
background:
rgba(
15,
15,
15,
0.95
);

padding:30px;

border-radius:25px;

}

.version{
background:#1DB954;
color:black;
padding:8px 15px;
border-radius:20px;
display:inline-block;
font-weight:bold;
}

input,
textarea,
select{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:15px;

background:#222;

color:white;

}

textarea{
height:220px;
}

button{

padding:14px;

margin-top:10px;

border:none;

border-radius:15px;

cursor:pointer;

font-weight:bold;

width:100%;

}

.green{
background:#1DB954;
color:black;
}

.blue{
background:#2196F3;
color:white;
}

.orange{
background:#ff9800;
}

.red{
background:#e53935;
}

#log{
margin-top:20px;
padding:20px;
background:#111;
border-radius:20px;
font-family:monospace;
white-space:pre-wrap;
max-height:350px;
overflow:auto;
}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator AI
</h1>

<div class="version">
Versión v2.1
</div>

<input
id="geminiKey"
placeholder="Gemini API">

<button
class="green"
onclick="saveGeminiKey()">
Guardar Gemini
</button>

<textarea
id="promptAI"
placeholder="Rock clásico carretera">
</textarea>

<select id="songCount">

<option value="10">
10
</option>

<option value="25">
25
</option>

<option value="50">
50
</option>

<option value="100">
100
</option>

</select>

<button
class="blue"
onclick="generateAIPlaylist()">
Generar IA
</button>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs">
</textarea>

<button
class="green"
onclick="loginSpotify()">
Conectar Spotify
</button>

<button
class="orange"
onclick="changeUser()">
Cambiar cuenta
</button>

<button
class="blue"
onclick="createPlaylist()">
Crear playlist
</button>

<button
class="red"
onclick="clearStorage()">
Borrar datos
</button>

<div id="log">
Esperando conexión
</div>

</div>

<script>

const APP_VERSION=
"v2.1";

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=
[
"user-read-private",
"playlist-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(
" "
);

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

document.getElementById(
"geminiKey"
).value=
localStorage.getItem(
"gemini_key"
)||"";

function saveGeminiKey(){

localStorage.setItem(
"gemini_key",
document.getElementById(
"geminiKey"
).value
);

msg(
"Gemini guardada"
);

}

async function searchSong(song){

msg(
`Buscar:
${song}`
);

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&market=MX&limit=1`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks
?.items?.[0]
?.uri||null;

}

async function createPlaylist(){

log.innerHTML="";

msg(
APP_VERSION
);

if(!accessToken){

msg(
"No conectado Spotify"
);

return;

}

msg(
"Creando playlist..."
);

const playlistRes=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

name:
document.getElementById(
"playlistName"
).value,

public:false

})

}
);

const playlist=
await playlistRes.json();

msg(
`HTTP playlist:
${playlistRes.status}`
);

if(
!playlistRes.ok
){

msg(
JSON.stringify(
playlist
)
);

return;

}

const songs=
document
.getElementById(
"songs"
)
.value
.split(
"\n"
)
.filter(
x=>x.trim()
);

let uris=[];

for(
let i=0;
i<songs.length;
i++
){

msg(
`${i+1}/${songs.length}`
);

const uri=
await searchSong(
songs[i]
);

if(uri){

uris.push(
uri
);

}

}

msg(
`Encontradas:
${uris.length}`
);

const add=
await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,

"Content-Type":
"application/json"

},

body:
JSON.stringify({
uris
})

}
);

msg(
`HTTP canciones:
${add.status}`
);

const result=
await add.json();

msg(
JSON.stringify(
result,
null,
2
)
);

if(
add.ok
){

window.open(
playlist.external_urls.spotify,
"_blank"
);

msg(
"Playlist terminada"
);

}

}

</script>

</body>
</html>
