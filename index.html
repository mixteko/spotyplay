<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Spotify Playlist Creator AI v3.5
</title>

<style>

body{
margin:0;
font-family:Arial;
background:
linear-gradient(
135deg,
#050505,
#121212,
#1DB954
);

padding:30px;
color:white;
}

.card{
max-width:1100px;
margin:auto;
background:#111;
padding:30px;
border-radius:25px;
}

.statusBox{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.status{
padding:12px 20px;
border-radius:15px;
font-weight:bold;
}

.green{
background:#1DB954;
color:black;
}

.red{
background:#e53935;
}

.orange{
background:#ff9800;
color:black;
}

input,
textarea,
button{

width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:15px;

}

input,
textarea{
background:#222;
color:white;
}

textarea{
height:220px;
resize:vertical;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.buttons button{
flex:1;
}

#log{
margin-top:20px;
background:black;
padding:20px;
border-radius:20px;
white-space:pre-wrap;
max-height:320px;
overflow:auto;
}

</style>

</head>

<body>

<div class="card">

<h1>
Spotify Playlist Creator AI
</h1>

<div>
Versión v3.5
</div>

<div class="statusBox">

<div
id="spotifyStatus"
class="status red">

Spotify 🔴

</div>

<div
id="deepseekStatus"
class="status red">

DeepSeek 🔴

</div>

<div
id="playlistStatus"
class="status red">

Playlist 🔴

</div>

</div>

<input
id="deepseekKey"
placeholder="DeepSeek API Key">

<div class="buttons">

<button
class="green"
onclick="saveDeepSeek()">

Guardar

</button>

<button
class="orange"
onclick="testDeepSeek()">

Probar DeepSeek

</button>

</div>

<textarea
id="promptAI"
placeholder="Rock carretera USA">
</textarea>

<div class="buttons">

<button
class="orange"
onclick="generateDeepSeek()">

Generar Lista

</button>

<button
class="orange"
onclick="generateDeepSeek(true)">

Buscar Más

</button>

</div>

<input
id="playlistName"
placeholder="Nombre playlist">

<textarea
id="songs">
</textarea>

<div class="buttons">

<button
class="green"
onclick="loginSpotify()">

Conectar Spotify

</button>

<button
class="orange"
onclick="changeUser()">

Cambiar cuenta

</button>

<button
class="green"
onclick="createPlaylist()">

Crear Playlist

</button>

</div>

<div id="log">
Esperando conexión
</div>

</div>

<script>

const CLIENT_ID=
"6c398ae66eae4f84959cfce08bd0c74c";

const REDIRECT_URI=
"https://mixteko.github.io/spotyplay/";

const SCOPES=[
"user-read-private",
"playlist-modify-private",
"playlist-modify-public"
].join(" ");

let accessToken=
localStorage.getItem(
"spotify_token"
)||"";

const log=
document.getElementById(
"log"
);

function msg(t){

log.innerHTML +=
"\n"+t;

log.scrollTop=
log.scrollHeight;

}

function saveDeepSeek(){

localStorage.setItem(
"deepseek_key",
document.getElementById(
"deepseekKey"
).value.trim()
);

msg(
"DeepSeek guardada"
);

updateStatus();

}

document.getElementById(
"deepseekKey"
).value=
localStorage.getItem(
"deepseek_key"
)||"";

function updateStatus(){

document.getElementById(
"spotifyStatus"
).className=
accessToken ?
"status green":
"status red";

document.getElementById(
"spotifyStatus"
).innerHTML=
accessToken ?
"Spotify 🟢":
"Spotify 🔴";

}

async function testDeepSeek(){

const key=
localStorage.getItem(
"deepseek_key"
);

if(!key){

msg(
"Guardar API"
);

return;

}

const box=
document.getElementById(
"deepseekStatus"
);

box.className=
"status orange";

box.innerHTML=
"DeepSeek 🟡";

try{

const r=
await fetch(
"https://api.deepseek.com/chat/completions",
{
method:"POST",

headers:{
Authorization:
`Bearer ${key}`,

"Content-Type":
"application/json"
},

body:
JSON.stringify({

model:
"deepseek-chat",

messages:[
{
role:"user",
content:
"Responde OK"
}
]

})

}
);

const d=
await r.json();

if(
d.choices
){

box.className=
"status green";

box.innerHTML=
"DeepSeek 🟢";

msg(
"DeepSeek conectada"
);

}else{

box.className=
"status red";

box.innerHTML=
"DeepSeek 🔴";

msg(
JSON.stringify(
d,
null,
2
)
);

}

}
catch(e){

box.className=
"status red";

box.innerHTML=
"DeepSeek 🔴";

msg(
e.message
);

}

}

async function generateDeepSeek(more=false){

const key=
localStorage.getItem(
"deepseek_key"
);

if(!key){

msg(
"Guardar API"
);

return;

}

msg(
more ?
"Buscando más..."
:
"Generando..."
);

const r=
await fetch(
"https://api.deepseek.com/chat/completions",
{
method:"POST",

headers:{
Authorization:
`Bearer ${key}`,

"Content-Type":
"application/json"
},

body:
JSON.stringify({

model:
"deepseek-chat",

messages:[
{
role:"user",

content:
`
Genera 20 canciones.

Formato:

ARTISTA - CANCION

Tema:

${document.getElementById(
"promptAI"
).value}

${
more ?
"No repitas canciones":
""
}

Sin numeración
`
}
]

})

}
);

const d=
await r.json();

const text=
d.choices?.[0]
?.message
?.content;

document.getElementById(
"songs"
).value=
text || "";

msg(
"Lista generada"
);

}

async function searchSong(song){

const r=
await fetch(
`https://api.spotify.com/v1/search?q=${encodeURIComponent(song)}&type=track&limit=1`,
{
headers:{
Authorization:
`Bearer ${accessToken}`
}
}
);

const d=
await r.json();

return d.tracks
?.items?.[0]
?.uri||null;

}

async function createPlaylist(){

if(!accessToken){

msg(
"Spotify no conectado"
);

return;

}

msg(
"Creando playlist..."
);

const p=
await fetch(
"https://api.spotify.com/v1/me/playlists",
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({

name:
document.getElementById(
"playlistName"
).value ||
"Playlist DeepSeek",

public:false

})

}
);

const playlist=
await p.json();

const songs=
document
.getElementById(
"songs"
)
.value
.split(
"\n"
)
.filter(
x=>x.trim()
);

let uris=[];

for(
const s
of songs
){

const uri=
await searchSong(
s
);

if(uri){

uris.push(
uri
);

}

}

await fetch(
`https://api.spotify.com/v1/playlists/${playlist.id}/items`,
{
method:"POST",

headers:{
Authorization:
`Bearer ${accessToken}`,
"Content-Type":
"application/json"
},

body:
JSON.stringify({
uris
})

}
);

document.getElementById(
"playlistStatus"
).className=
"status green";

document.getElementById(
"playlistStatus"
).innerHTML=
"Playlist 🟢";

window.open(
playlist.external_urls.spotify
);

msg(
"Playlist creada"
);

}

function randomString(n){

return [...Array(n)]
.map(
()=>Math.random()
.toString(36)[2]
)
.join("");

}

async function challenge(v){

const d=
new TextEncoder()
.encode(v);

const h=
await crypto.subtle.digest(
"SHA-256",
d
);

return btoa(
String.fromCharCode(
...new Uint8Array(h)
))
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}

async function loginSpotify(){

const verifier=
randomString(
64
);

localStorage.setItem(
"spotify_verifier",
verifier
);

const c=
await challenge(
verifier
);

const p=
new URLSearchParams({

client_id:
CLIENT_ID,

response_type:
"code",

redirect_uri:
REDIRECT_URI,

scope:
SCOPES,

show_dialog:true,

code_challenge_method:
"S256",

code_challenge:c

});

window.location=
"https://accounts.spotify.com/authorize?"+
p;

}

async function getToken(){

const code=
new URLSearchParams(
location.search
).get(
"code"
);

if(!code){

updateStatus();

return;

}

const verifier=
localStorage.getItem(
"spotify_verifier"
);

const body=
new URLSearchParams({

client_id:
CLIENT_ID,

grant_type:
"authorization_code",

code,

redirect_uri:
REDIRECT_URI,

code_verifier:
verifier

});

const r=
await fetch(
"https://accounts.spotify.com/api/token",
{
method:"POST",
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
body
}
);

const d=
await r.json();

accessToken=
d.access_token;

localStorage.setItem(
"spotify_token",
accessToken
);

updateStatus();

msg(
"Spotify conectado"
);

}

function changeUser(){

window.open(
"https://www.spotify.com/logout/",
"_blank"
);

localStorage.clear();

location.reload();

}

updateStatus();

getToken();

</script>

</body>
</html>
